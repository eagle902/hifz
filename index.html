const words=t=>t.split(/\s+/).filter(Boolean);
const textOf=k=>{const[s,a]=k.split(":").map(Number);return s===D.meta.surah?V[a-1]:(D.twins[k]||"")};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const secOf=a=>SEC.findIndex(s=>a>=s.from&&a<=s.to);
const secStyle=a=>'style="--sec:'+SEC[secOf(a)].color+'"';


/* storage: this device only */
function load(){let st={done:{},cur:0,rounds:{}};try{const r=localStorage.getItem(D.meta.store);if(r)st=Object.assign(st,JSON.parse(r))}catch(e){}
  const fix=o=>{const n={};Object.keys(o||{}).forEach(k=>{n[k.includes(":")?k.split(":")[1]:k]=o[k]});return n};st.done=fix(st.done);st.rounds=fix(st.rounds);
  if(!(st.cur>=0&&st.cur<Math.max(1,C.length)))st.cur=0;return st}
const pref=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
function useDeck(id){D=ALLD.decks.find(x=>x.id===id)||ALLD.decks[0];C=D.cards;V=D.verses;SEC=D.sections;POOL=D.pool||[];ALL=V.concat(POOL);_ch=null;S=load();pref("hifz-deck",D.id);$("#brand").textContent=D.meta.title}
const UN=()=>(D&&D.meta.unit)||'الغرفة';
const FM=(f,m)=>UN()==='الغرفة'?f:m;
const doneWord=()=>D.meta.mode==="review"?"ثبتت":"حُفظت";
const save=()=>{try{localStorage.setItem(D.meta.store,JSON.stringify(S))}catch(e){}};

/* matching */
const TESTS=[(a,p)=>a===p,(a,p)=>a.startsWith(p),(a,p)=>p.length>2&&a.endsWith(p)];
function findSpan(s,kw,used){const parts=words(kw).map(sk).filter(Boolean);
  for(const f of TESTS)for(let i=0;i+parts.length<=s.length;i++){if(parts.some((_,j)=>used.has(i+j)))continue;if(parts.every((p,j)=>f(s[i+j],p)))return[i,parts.length]}return null}
function spans(ws,list){const s=ws.map(sk),used=new Set(),out=[];list.forEach((kw,n)=>{const sp=findSpan(s,kw,used);if(sp){for(let j=0;j<sp[1];j++)used.add(sp[0]+j);out.push([sp[0],sp[1],n])}});return out}
function chunks(ws){const out=[];let cur=[];
  ws.forEach((w,i)=>{cur.push(i);const stop=/[ۖۗۘۙۚۛ]$/.test(w);if((stop&&cur.length>=3)||cur.length>=7){out.push(cur);cur=[]}});
  if(cur.length){if(cur.length<3&&out.length)out[out.length-1]=out[out.length-1].concat(cur);else out.push(cur)}
  if(out.length<2&&ws.length>=4){const h=Math.ceil(ws.length/2);return[[...Array(h).keys()],[...Array(ws.length-h).keys()].map(x=>x+h)]}
  return out}
function units(ws){const ch=chunks(ws);if(ch.length>=3)return ch;if(ws.length<5)return ch;const out=[],n=ws.length>=10?3:2;for(let i=0;i<ws.length;i+=n)out.push([...Array(Math.min(n,ws.length-i)).keys()].map(x=>x+i));
  if(out.length>1&&out[out.length-1].length===1){const l=out.pop();out[out.length-1].push(...l)}return out}
function lcsMarks(a,b){const A=a.map(sk),B=b.map(sk),n=A.length,m=B.length,L=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)L[i][j]=A[i]===B[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
  const ma=new Array(n).fill(true),mb=new Array(m).fill(true);let i=0,j=0;
  while(i<n&&j<m){if(A[i]===B[j]){ma[i]=mb[j]=false;i++;j++}else if(L[i+1][j]>=L[i][j+1])i++;else j++}return[ma,mb]}
const vHTML=(ws,a,cls,attr)=>ws.map((w,i)=>cls&&cls[i]?'<span class="'+cls[i]+'"'+(attr&&attr[i]?attr[i]:'')+'>'+w+'</span>':w).join(" ")+(a?' <span class="am">﴿'+AR(a)+'﴾</span>':"");

/* header */
function header(){const tb=document.querySelectorAll('header [data-act]');if(!D||UI.view==="home"){$("#stats").innerHTML='';$("#segbar").innerHTML='';tb.forEach(x=>x.hidden=true);$("#brand").textContent="";return}
  if(D.meta.doorsOnly){tb.forEach(x=>x.hidden=x.dataset.act==="map");$("#brand").textContent=D.meta.title;const dc=Object.keys(S.dclean||{}).length;$("#stats").innerHTML='<span>🚪 '+AR(D.doors.length)+' بابًا</span><span>✅ غرف ثابتة '+AR(dc)+' من '+AR(SEC.length)+'</span>';$("#segbar").innerHTML=SEC.map((s,i)=>'<i style="--sec:'+s.color+'" class="'+((S.dclean||{})[i]?'d':'')+'"></i>').join("");return}
  tb.forEach(x=>x.hidden=false);$("#brand").textContent=D.meta.title;const done=C.filter(c=>S.done[c.a]).length;
  $("#stats").innerHTML='<span>✅ '+(D.meta.mode==="review"?"ثبتت ":"حُفظ ")+AR(done)+'</span><span>🔆 الحالية '+AR(C[S.cur].a)+'</span><span>⏳ المتبقي '+AR(C.length-done)+' من '+AR(C.length)+'</span>';
  $("#segbar").innerHTML=C.map((c,i)=>'<i '+secStyle(c.a)+' class="'+(S.done[c.a]?'d':'')+(i===S.cur?' c':'')+'"></i>').join("")}

/* scene panel */
function scenePanel(c,opts){const si=secOf(c.a),s=SEC[si];
  let h='<div class="scene" '+secStyle(c.a)+' data-big="'+s.icon+'"><span class="badge">'+s.icon+' '+UN()+' '+AR(si+1)+' من '+AR(SEC.length)+' · '+esc(s.name)+'</span>'
   +'<div class="icons" aria-hidden="true">'+c.sc[0]+'</div><h2>'+esc(c.sc[1])+'</h2>'+(opts&&opts.noLine?'':'<p>'+esc(c.sc[2])+'</p>');
  if(!(opts&&opts.noPath)){h+='<div class="minipath">';C.forEach(x=>{const a=x.a;if(a<s.from||a>s.to)return;h+='<span class="'+(S.done[a]?'d':'')+(a===c.a?' c':'')+'">'+AR(a)+'</span>'});h+='</div>'}
  return h+'</div>'}
const keysList=c=>'<ul class="keys">'+c.h.map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>';

/* card */
let UI={view:"card",quiz:null,bub:null,open:{},hide:true};
function locLine(c,i){return '<div class="loc"><span>📍 الحزب <b>'+AR(c.hz)+'</b> · الربع <b>'+["","الأول","الثاني","الثالث","الرابع"][c.qt]+'</b> · ص '+AR(c.pg)+' · الآية <b>'+AR(c.a)+'</b></span><span>بطاقة '+AR(i+1)+' من '+AR(C.length)+(S.done[c.a]?' · ✅':'')+'</span></div>'}
function renderCard(){const i=S.cur,c=C[i],ws=words(V[c.a-1]);
  const kw=spans(ws,c.k),mm=spans(ws,c.m.map(x=>x[0])),cls=ws.map(()=>""),attr=ws.map(()=>"");
  kw.forEach(([s,l])=>{for(let j=s;j<s+l;j++)cls[j]="kw"});
  mm.forEach(([s,l,n])=>{for(let j=s;j<s+l;j++){cls[j]=(cls[j]+" mw").trim();attr[j]=' data-act="bub" data-n="'+n+'"'}});
  let h=locLine(c,i);
  h+='<div class="card"><div class="quran">'+vHTML(ws,c.a,cls,attr)+'</div>'+(UI.bub!=null&&c.m[UI.bub]?'<div class="bubble">📖 <b>'+esc(mm.find(x=>x[2]===UI.bub)?ws.slice(mm.find(x=>x[2]===UI.bub)[0],mm.find(x=>x[2]===UI.bub)[0]+mm.find(x=>x[2]===UI.bub)[1]).join(" "):c.m[UI.bub][0])+'</b>: '+esc(c.m[UI.bub][1])+'</div>':'')+'</div>';
  h+=scenePanel(c);
  if(c.m.length){h+='<div class="card"><p class="lbl">📖 معاني الكلمات</p><div class="chips">'+c.m.map(([w,mean],n)=>{const sp=mm.find(x=>x[2]===n);return'<div class="chip"><b>'+(sp?ws.slice(sp[0],sp[0]+sp[1]).join(" "):esc(w))+'</b><span>'+esc(mean)+'</span></div>'}).join("")+'</div></div>'}
  h+='<div class="card"><p class="lbl">🔑 مفاتيح الحفظ</p>'+keysList(c)+'</div>';
  const pw=c.a>1?words(V[c.a-2]):null,nw=c.a<V.length?words(V[c.a]):null;
  h+='<div class="card"><p class="lbl">🔗 السلسلة: قبلها ← هي ← بعدها</p><div class="chain"><div class="ctx">'+(pw?'… '+pw.slice(-3).join(" ")+' ﴿'+AR(c.a-1)+'﴾':'<span class="small">بداية السورة</span>')+'</div><div class="me">'+(C[i].sc[0].match(/\p{Extended_Pictographic}/u)||[""])[0]+'</div><div class="ctx">'+(nw?nw.slice(0,3).join(" ")+' …':'<span class="small">نهاية السورة 🏁</span>')+'</div></div></div>';
  if(c.tw&&textOf(c.tw)){const tw=words(textOf(c.tw)),[ma,mb]=lcsMarks(ws,tw),inS=c.tw.startsWith(D.meta.surah+":");
    h+='<div class="card twin"><details><summary>⚠️ تشبهها: '+(inS?'الآية '+AR(c.tw.split(":")[1]):esc(c.tw))+'. اضغط لترى الفرق</summary>'
     +'<p class="lbl" style="margin-top:12px">آيتك ('+AR(c.a)+')</p><div class="quran sm mine">'+vHTML(ws,c.a,ma.map(x=>x?"diff":""))+'</div>'
     +'<p class="lbl" style="margin-top:12px">الشبيهة ('+esc(c.tw)+')</p><div class="quran sm">'+vHTML(tw,0,mb.map(x=>x?"diff":""))+'</div></details></div>'}
  h+='<div class="sticky-foot"><button class="btn primary big" data-act="start">ابدأ الاختبار ▸</button>'
   +'<div class="row" style="justify-content:space-between;margin-top:10px"><button class="btn ghost" data-act="prev"'+(i===0?' disabled':'')+'>▸ السابقة</button><button class="btn ghost" data-act="next"'+(i===C.length-1?' disabled':'')+'>التالية ◂</button></div></div>';
  $("#main").innerHTML=h}

/* quiz building */
const pick=(arr,n,avoid)=>{const seen=new Set((avoid||[]).map(sk)),out=[];for(const x of arr){const key=sk(x);if(!key||seen.has(key))continue;seen.add(key);out.push(x);if(out.length>=n)break}return out};
const allChunks=()=>_ch||(_ch=ALL.flatMap(t=>{const ws=words(t);return chunks(ws).map(x=>x.map(j=>ws[j]).join(" "))}));
const opening=(t,n)=>words(t).slice(0,n||3).join(" ");
const voc=k=>{const p=words(k).map(sk);for(const t of ALL){const w=words(t);for(let i=0;i+p.length<=w.length;i++)if(p.every((x,j)=>sk(w[i+j])===x))return w.slice(i,i+p.length).join(" ")}return k};
function buildQuiz(c){const ws=words(V[c.a-1]),ch=chunks(ws),cht=ch.map(x=>x.map(j=>ws[j]).join(" ")),Q=[];
  const tw=c.tw&&textOf(c.tw)?words(textOf(c.tw)):[],twCh=tw.length?chunks(tw).map(x=>x.map(j=>tw[j]).join(" ")):[];
  // opening from scene
  const op=opening(V[c.a-1]),opDis=shuffle(V.filter((_,j)=>j!==c.a-1).map(t=>opening(t)));
  if(tw.length)opDis.unshift(opening(tw.join(" ")));
  Q.push({t:"mc",title:"🎬 من المشهد: بأيّ كلمات تبدأ الآية؟",pre:scenePanel(c,{noPath:1}),ans:op,opts:shuffle([op].concat(pick(opDis,3,[op])))});
  // meaning
  if(c.m.length){const [w,mean]=c.m[Math.floor(Math.random()*c.m.length)],others=shuffle(C.flatMap(x=>x.m.map(y=>y[1])).filter(x=>x!==mean));
    const sp=spans(ws,[w])[0],shown=sp?ws.slice(sp[0],sp[0]+sp[1]).join(" "):w;
    const uniq=[];others.forEach(o=>{if(!uniq.includes(o)&&uniq.length<3)uniq.push(o)});
    Q.push({t:"mc",ui:1,title:"📖 ما معنى الكلمة؟",pre:'<div class="big-word">'+shown+'</div>',ans:mean,opts:shuffle([mean].concat(uniq))})}
  // cloze (2 keywords)
  const kwPool=shuffle(C.filter(x=>x.a!==c.a).flatMap(x=>x.k));
  shuffle(spans(ws,c.k)).slice(0,2).forEach(([s,len])=>{const ans=ws.slice(s,s+len).join(" ");
    const ci=ch.findIndex(x=>x.includes(s)),from=ch[Math.max(0,ci-1)][0],to=ch[ci].slice(-1)[0];
    const ctx=[];for(let j=from;j<=Math.max(to,s+len-1);j++){if(j===s){ctx.push('<span class="blank">؟</span>');j+=len-1}else ctx.push(ws[j])}
    const twW=len===1?shuffle(tw.filter(w=>!ws.some(x=>sk(x)===sk(w))&&Math.abs(sk(w).length-sk(ans).length)<=3)):[];
    const dis=twW.concat(kwPool.filter(k=>words(k).length===len).map(voc));if(len>1){for(let n=0;n<12;n++){const t=words(ALL[Math.floor(Math.random()*ALL.length)]);if(t.length>len){const st=Math.floor(Math.random()*(t.length-len));dis.push(t.slice(st,st+len).join(' '))}}}
    Q.push({t:"mc",title:"✍️ أكمل الفراغ",pre:'<div class="card"><div class="quran sm">'+(from>0?"… ":"")+ctx.join(" ")+(Math.max(to,s+len-1)<ws.length-1?" …":' <span class="am">﴿'+AR(c.a)+'﴾</span>')+'</div></div>',ans,opts:shuffle([ans].concat(pick(dis,3,[ans])))})});
  // next chunk
  if(cht.length>=2){const j=Math.floor(Math.random()*(cht.length-1)),ans=cht[j+1];
    const dis=shuffle(cht.filter((_,x)=>x!==j&&x!==j+1)).concat(shuffle(twCh),shuffle(allChunks()).slice(0,40));
    Q.push({t:"mc",title:"➡️ ماذا يأتي بعد هذا المقطع؟",pre:'<div class="card"><div class="quran sm">'+(j>0?"… ":"")+cht[j]+' …</div></div>',ans,opts:shuffle([ans].concat(pick(dis,3,[ans,cht[j]])))})}
  // order
  const un=units(ws);if(un.length>=3){const st=un.length>5?Math.floor(Math.random()*(un.length-4)):0,seq=un.slice(st,st+5).map(x=>x.map(j=>ws[j]).join(" "));
    Q.push({t:"order",title:"🧩 رتّب الآية",seq,opts:shuffle(seq.map((x,i)=>({x,i})))})}
  // ending
  const end=ws.slice(-2).join(" "),ew=words(end).map(sk);
  const scored=shuffle(ALL.map(t=>words(t).slice(-2).join(" "))).map(e=>{const w=words(e).map(sk);return{e,s:(w[0]===ew[0]?2:0)+(w[1]===ew[1]?2:0)+(w[1]&&ew[1]&&w[1].slice(-2)===ew[1].slice(-2)?1:0)}}).sort((a,b)=>b.s-a.s).map(x=>x.e);
  if(ws.length>=4)Q.push({t:"mc",title:"🏁 بماذا تُختم الآية؟",pre:'<div class="card"><div class="quran sm">'+(ws.length>8?"… ":"")+ws.slice(-8,-2).join(" ")+' <span class="blank">؟</span> <span class="am">﴿'+AR(c.a)+'﴾</span></div></div>',ans:end,opts:shuffle([end].concat(pick((tw.length?[tw.slice(-2).join(" ")]:[]).concat(pick(scored,6,[end])),3,[end])))});
  // bridge to next verse
  if(c.a<V.length){const nx=opening(V[c.a]),dis=shuffle(V.filter((_,j)=>j!==c.a).map(t=>opening(t)));
    Q.push({t:"mc",title:"🔗 الربط: ما الآية التي تأتي بعدها؟",pre:'<div class="card"><div class="quran sm">… '+ws.slice(-4).join(" ")+' <span class="am">﴿'+AR(c.a)+'﴾</span> <span class="blank">؟</span></div></div>',ans:nx,opts:shuffle([nx].concat(pick(dis,3,[nx])))})}
  Q.push({t:"recite",title:"🎙️ سمِّع الآية كاملة من حفظك، بصوتك"});
  return{c,Q,i:0,res:[],state:null}}
function buildChain(){const list=shuffle(C.filter(c=>c.a<V.length).map(c=>c.a-1)).slice(0,10).sort((a,b)=>a-b),Q=list.map(j=>{const ws=words(V[j]),nx=opening(V[j+1]),dis=shuffle(V.filter((_,x)=>x!==j+1).map(t=>opening(t)));
  return{t:"mc",title:"🔗 ما الآية التي تأتي بعد الآية "+AR(j+1)+"؟",pre:'<div class="card"><div class="quran sm">… '+ws.slice(-5).join(" ")+' <span class="am">﴿'+AR(j+1)+'﴾</span></div></div>',ans:nx,opts:shuffle([nx].concat(pick(dis,3,[nx])))}});
  return{chain:1,kind:"chain",label:"🔗 اختبار السلسلة",c:C[S.cur],Q,i:0,res:[],state:null}}
/* doors drill */
function buildDoors(room){const DR=D.doors.filter(d=>room==null||d.room===room),Q=[];
  shuffle(DR).forEach(d=>{const others=D.doors.filter(x=>x!==d);const t=d.prevText&&Math.random()<0.6?"fwd":"back";
    const lab=d.label;
    if(t==="fwd"||!d.prevText)Q.push({t:"mc",title:"🚪 "+lab+": بعد هذه النهاية، بماذا يبدأ؟",pre:'<div class="card"><p class="lbl">نهاية ما قبله · '+esc(d.prevRef)+'</p><div class="quran sm">… '+d.prevText+'</div></div>',ans:d.start,opts:shuffle([d.start].concat(pick(shuffle(others.map(x=>x.start)),3,[d.start]))),door:d});
    else Q.push({t:"mc",title:"🔙 "+lab+": هذا مطلعه، فما نهاية ما قبله؟",pre:'<div class="card"><p class="lbl">المطلع</p><div class="quran sm">'+d.start+' …</div></div>',ans:d.prevText,opts:shuffle([d.prevText].concat(pick(shuffle(others.filter(x=>x.prevText).map(x=>x.prevText)),3,[d.prevText]))),door:d})});
  const rooms=room==null?SEC.map((_,i)=>i):[room];
  rooms.forEach(r=>{const ds=D.doors.filter(d=>d.room===r);if(ds.length>=3)Q.push({t:"order",title:"🧩 رتّب مطالع "+esc(SEC[r].name),seq:ds.map(d=>d.start),opts:shuffle(ds.map((d,i)=>({x:d.start,i})))})});
  const rd=shuffle(DR.filter(d=>d.prevText))[0];if(rd)Q.push({t:"doorRecite",title:"🎙️ سمِّع مطلع "+rd.label+" بعد هذه النهاية",door:rd});
  return{chain:1,kind:"doors",room,label:"🚪 تمرين الأبواب",c:C[S.cur],Q,i:0,res:[],state:null}}
/* group quiz (whole scene) */
function win(arr,n){if(arr.length<=n)return arr;const st=Math.floor(Math.random()*(arr.length-n+1));return arr.slice(st,st+n)}
function buildGroup(si){const s=SEC[si],Q=[],all=C.filter(c=>c.a>=s.from&&c.a<=s.to);
  const bridges=all.filter(c=>c.a<s.to),pickB=bridges.length>8?shuffle(bridges).slice(0,8).sort((a,b)=>a.a-b.a):bridges;
  const sc=(s.scenes||[]),rs=sc.length&&all.length>10?shuffle(sc)[0]:null,recList=rs?all.filter(c=>c.a>=rs.from&&c.a<=rs.to):win(all,10);
  pickB.forEach(c=>{const ws=words(V[c.a-1]),nx=opening(V[c.a]),dis=shuffle(V.filter((_,x)=>x!==c.a).map(t=>opening(t)));
    Q.push({t:"mc",title:"🔗 ما الآية التي تأتي بعد الآية "+AR(c.a)+"؟",pre:'<div class="card"><div class="quran sm">… '+ws.slice(-4).join(" ")+' <span class="am">﴿'+AR(c.a)+'﴾</span></div></div>',ans:nx,opts:shuffle([nx].concat(pick(dis,3,[nx])))})});
  let list=win(all,7);
  Q.push({t:"order",title:"🧩 رتّب صور "+esc(s.name)+(list.length<all.length?" ("+AR(list[0].a)+"–"+AR(list[list.length-1].a)+")":""),seq:list.map(c=>c.sc[0]+" "+c.sc[1]),opts:shuffle(list.map((c,i)=>({x:c.sc[0]+" "+c.sc[1],i}))),ui:1});
  list=win(all,7);
  Q.push({t:"order",title:"🧩 رتّب مطالع الآيات "+AR(list[0].a)+"–"+AR(list[list.length-1].a),seq:list.map(c=>opening(V[c.a-1])),opts:shuffle(list.map((c,i)=>({x:opening(V[c.a-1]),i})))});
  Q.push({t:"groupRecite",title:"🎙️ سمِّع "+(rs?rs.icon+" "+esc(rs.title):esc(s.name))+" ("+AR(recList[0].a)+"–"+AR(recList[recList.length-1].a)+")",si,from:recList[0].a,to:recList[recList.length-1].a});
  return{chain:1,kind:"group",si,label:s.icon+" اختبار "+esc(s.name),c:C[S.cur],Q,i:0,res:[],state:null}}
/* intro + doors list */
function doorRow(d,hide){const shown=!hide||UI.open[d.a];

grock)"/><path d="M156 430 V240 Q156 132 256 108 Q356 132 356 240 V430" fill="none" stroke="#1E130B" stroke-opacity=".6" stroke-width="9"/><g transform="translate(256 262)" fill="#FFE7A8" opacity=".28"> <g id="lgr"><polygon points="-3,-60 3,-60 0.8,-240 -0.8,-240"/></g> <use href="#lgr" transform="rotate(30)"/><use href="#lgr" transform="rotate(60)"/><use href="#lgr" transform="rotate(90)"/><use href="#lgr" transform="rotate(120)"/><use href="#lgr" transform="rotate(150)"/><use href="#lgr" transform="rotate(180)"/><use href="#lgr" transform="rotate(210)"/><use href="#lgr" transform="rotate(240)"/><use href="#lgr" transform="rotate(270)"/><use href="#lgr" transform="rotate(300)"/><use href="#lgr" transform="rotate(330)"/></g><circle cx="256" cy="262" r="170" fill="url(#lghalo)"/><line x1="256" y1="112" x2="256" y2="196" stroke="url(#lgbrass)" stroke-width="5" stroke-dasharray="9 5"/><path d="M236 206 Q256 190 276 206 Z" fill="url(#lgbrass)"/><circle cx="256" cy="262" r="62" fill="#FFF2C2" filter="url(#lgb10)" opacity=".9"/><path d="M256 204 Q308 214 312 262 Q310 312 256 326 Q202 312 200 262 Q204 214 256 204Z" fill="url(#lgglobe)"/><path d="M226 230 Q238 214 256 212" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" fill="none" opacity=".85"/><path d="M256 236 Q270 262 263 280 Q256 292 249 280 Q242 262 256 236Z" fill="#FFFFFF"/><rect x="232" y="322" width="48" height="10" rx="5" fill="url(#lgbrass)"/><rect x="140" y="424" width="232" height="18" rx="5" fill="#3E2816"/><rect width="512" height="512" fill="url(#lgvign)"/></svg>`;
function renderHome(){const last=pref("hifz-deck");
  let h='<div class="brandhero">'+LOGO+'<div class="bh-name">حفظ</div><div class="bh-tag">نُورٗا مُّبِينٗا</div><div class="small muted">النساء ﴿١٧٤﴾</div></div><h2 style="margin:18px 0 4px">اختر السورة</h2><p class="muted" style="margin:0 0 8px">لكل سورة بطاقاتها وتقدّمها.</p>';
  ALLD.decks.forEach(d=>{let st={done:{}};try{const r=localStorage.getItem(d.meta.store);if(r)st=JSON.parse(r)}catch(e){}
    const dO=d.meta.doorsOnly,n=dO?d.sections.length:d.cards.length,dn=Math.min(n,Object.keys((dO?st.dclean:st.done)||{}).length),pc=Math.round(dn/n*100),col=d.sections[0].color;
    h+='<button class="deck'+(d.id===last?' last':'')+'" style="--sec:'+col+'" data-act="deck" data-id="'+d.id+'"><span class="dk-ico">'+d.frame.s+'</span><span class="dk-body"><b>سورة '+d.meta.name+'</b><span class="dk-mode">'+(d.meta.mode==="review"?"🔁 مراجعة":"🌱 حفظ")+' · '+esc(d.meta.sub)+'</span><span class="dk-bar"><i style="width:'+pc+'%"></i></span><span class="small muted">'+AR(dn)+' من '+AR(n)+(dO?' غرف ثابتة':' آية')+(d.id===last?' · آخر ما فتحت':'')+'</span></span><span class="dk-go">◂</span></button>'});
  h+='<p class="small muted" style="margin-top:18px">التقدّم محفوظ على هذا الجهاز فقط.</p>';
  $("#main").innerHTML=h}
function render(){header();if(UI.view==="home"||!D)return renderHome();if(UI.view==="map")return renderMap();if(UI.view==="quiz")return renderQuiz();if(UI.view==="intro"||D.meta.doorsOnly)return renderIntro();if(UI.view==="group")return renderGroup(UI.g);
  if(D.meta.groups){const c=C[S.cur],si=secOf(c.a);if(c.a===SEC[si].from&&!(S.gseen||{})[si]){UI.view="group";UI.g=si;return renderGroup(si)}}
  renderCard()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act,z=UI.quiz;
  if(a==="home"){UI.view="home"}
  else if(a==="deck"){useDeck(b.dataset.id);UI.view=(S.introSeen&&!D.meta.doorsOnly)?"card":"intro";UI.bub=null;UI.open={};UI.hide=true}
  else if(a==="intro"){UI.view="intro"}
  else if(a==="hideToggle"){UI.hide=UI.hide===false;UI.open={}}
  else if(a==="openDoor"){UI.open=UI.open||{};UI.open[b.dataset.a]=!UI.open[b.dataset.a]}
  else if(a==="doors"){UI.quiz=buildDoors(b.dataset.r!=null?+b.dataset.r:null);UI.view="quiz";UI.dh=0}
  else if(a==="dhint"){UI.dh=1}
  else if(a==="group"){UI.g=+b.dataset.g;UI.view="group"}
  else if(a==="gin"){S.gseen=S.gseen||{};S.gseen[b.dataset.g]=1;S.cur=+b.dataset.i;save();UI.view="card"}
  else if(a==="gquiz"){UI.quiz=buildGroup(+b.dataset.g);UI.view="quiz"}
  else if(a==="map")UI.view="map";
  else if(a==="card"){UI.view="card"}
  else if(a==="bub"){const n=+b.dataset.n;UI.bub=UI.bub===n?null:n}
  else if(a==="prev"){S.cur=Math.max(0,S.cur-1);save();UI.view="card";UI.bub=null}
  else if(a==="next"){S.cur=Math.min(C.length-1,S.cur+1);save();UI.view="card";UI.bub=null}
  else if(a==="goto"){S.cur=+b.dataset.i;save();UI.view="card";UI.bub=null}
  else if(a==="start"){UI.quiz=buildQuiz(C[S.cur]);UI.view="quiz"}
  else if(a==="chain"){UI.quiz=buildChain();UI.view="quiz"}
  else if(a==="mc"){const q=z.Q[z.i],j=+b.dataset.j;z.res[z.i]=q.opts[j]===q.ans;z.state={pick:j,final:true}}
  else if(a==="ord"){const q=z.Q[z.i],st=z.state,o=q.opts[+b.dataset.j];
    if(o.i===st.got.length){st.got.push(o.i);if(st.got.length===q.seq.length){z.res[z.i]=!st.miss;st.final=true}}
    else{st.miss=true;b.classList.add("bad","shake");setTimeout(()=>b.classList.remove("bad","shake"),400);return}}
  else if(a==="reveal"){z.state={}}
  else if(a==="self"){z.res[z.i]=b.dataset.v==="1";z.state.self=1;z.state.final=true}
  else if(a==="qnext"){z.i++;z.state=null;UI.dh=0}
  else if(a==="reset"){if(!b.dataset.sure){b.dataset.sure=1;b.textContent="اضغط مرة أخرى للتأكيد";return}S={done:{},cur:0,rounds:{},introSeen:1};save();UI.view="card"}
  render();if(!["bub","mc","ord","reveal","self","openDoor","hideToggle","dhint"].includes(a))window.scrollTo(0,0)});
UI.view="home";render();
})();
