لعيون؟"],"k":["قل ارايتم","اصبح","ماؤكم","غورا","يأتيكم","معين"],"tw":"18:41","h":["آخر آية: من المُلك (١) ← إلى الماء (٣٠).","غورًا (يغيب تحت الأرض) ⟷ معين (يجري ظاهرًا).","الكهف ١٨:٤١ «أو يصبح ماؤها غورًا»، وهنا «إن أصبح ماؤكم غورًا»."],"m":[["غورا","غائرًا ذاهبًا في أعماق الأرض"],["معين","جارٍ ظاهر تراه العيون"]],"pg":564,"hz":57,"qt":1}],"verses":["تَبَٰرَكَ ٱلَّذِي بِيَدِهِ ٱلۡمُلۡكُ وَهُوَ عَلَىٰ كُلِّ شَيۡءٖ قَدِيرٌ","ٱلَّذِي خَلَقَ ٱلۡمَوۡتَ وَٱلۡحَيَوٰةَ لِيَبۡلُوَكُمۡ أَيُّكُمۡ أَحۡسَنُ عَمَلٗاۚ وَهُوَ ٱلۡعَزِيزُ ٱلۡغَفُورُ","ٱلَّذِي خَلَقَ سَبۡعَ سَمَٰوَٰتٖ طِبَاقٗاۖ مَّا تَرَىٰ فِي خَلۡقِ ٱلرَّحۡمَٰنِ مِن تَفَٰوُتٖۖ فَٱرۡجِعِ ٱلۡبَصَرَ هَلۡ تَرَىٰ مِن فُطُورٖ","ثُمَّ ٱرۡجِعِ ٱلۡبَصَرَ كَرَّتَيۡنِ يَنقَلِبۡ إِلَيۡكَ ٱلۡبَصَرُ خَاسِئٗا وَهُوَ حَسِيرٞ","وَلَقَدۡ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنۡيَا بِمَصَٰبِيحَ وَجَعَلۡنَٰهَا رُجُومٗا لِّلشَّيَٰطِينِۖ وَأَعۡتَدۡنَا لَهُمۡ عَذَابَ ٱلسَّعِيرِ","وَلِلَّذِينَ كَفَرُواْ بِرَبِّهِمۡ عَذَابُ جَهَنَّمَۖ وَبِئۡسَ ٱلۡمَصِيرُ","إِذَآ أُلۡقُواْ فِيهَا سَمِعُواْ لَهَا شَهِيقٗا وَهِيَ تَفُورُ","تَكَادُ تَمَيَّزُ مِنَ ٱلۡغَيۡظِۖ كُلَّمَآ أُلۡقِيَ فِيهَا فَوۡجٞ سَأَلَهُمۡ خَزَنَتُهَآ أَلَمۡ يَأۡتِكُمۡ نَذِيرٞ","قَالُواْ بَلَىٰ قَدۡ جَآءَنَا نَذِيرٞ فَكَذَّبۡنَا وَقُلۡنَا مَا نَزَّلَ ٱللَّهُ مِن شَيۡءٍ إِنۡ أَنتُمۡ إِلَّا فِي ضَلَٰلٖ كَبِيرٖ","وَقَالُواْ لَوۡ كُنَّا نَسۡمَعُ أَوۡ نَعۡقِلُ مَا كُنَّا فِيٓ أَصۡحَٰبِ ٱلسَّعِيرِ","فَٱعۡتَرَفُواْ بِذَنۢبِهِمۡ فَسُحۡقٗا لِّأَصۡحَٰبِ ٱلسَّعِيرِ","إِنَّ ٱلَّذِينَ يَخۡشَوۡنَ رَبَّهُم بِٱلۡغَيۡبِ لَهُم مَّغۡفِرَةٞ وَأَجۡرٞ كَبِيرٞ","وَأَسِرُّواْ قَوۡلَكُمۡ أَوِ ٱجۡهَرُواْ بِهِۦٓۖ إِنَّهُۥ عَلِيمُۢ بِذَاتِ ٱلصُّدُورِ","أَلَا يَعۡلَمُ مَنۡ خَلَقَ وَهُوَ ٱللَّطِيفُ ٱلۡخَبِيرُ","هُوَ ٱلَّذِي جَعَلَ لَكُمُ ٱلۡأَرۡضَ ذَلُولٗا فَٱمۡشُواْ فِي مَنَاكِبِهَا وَكُلُواْ مِن رِّزۡقِهِۦۖ وَإِلَيۡهِ ٱلنُّشُورُ","ءَأَمِنتُم مَّن فِي ٱلسَّمَآءِ أَن يَخۡسِفَ بِكُمُ ٱلۡأَرۡضَ فَإِذَا هِيَ تَمُورُ","أَمۡ أَمِنتُم مَّن فِي ٱلسَّمَآءِ أَن يُرۡسِلَ عَلَيۡكُمۡ حَاصِبٗاۖ فَسَتَعۡلَمُونَ كَيۡفَ نَذِيرِ","وَلَقَدۡ كَذَّبَ ٱلَّذِينَ مِن قَبۡلِهِمۡ فَكَيۡفَ كَانَ نَكِيرِ","أَوَلَمۡ يَرَوۡاْ إِلَى ٱلطَّيۡرِ فَوۡقَهُمۡ صَـٰٓفَّـٰتٖ وَيَقۡبِضۡنَۚ مَا يُمۡسِكُهُنَّ إِلَّا ٱلرَّحۡمَٰنُۚ إِنَّهُۥ بِكُلِّ شَيۡءِۭ بَصِيرٌ","أَمَّنۡ هَٰذَا ٱلَّذِي هُوَ جُندٞ لَّكُمۡ يَنصُرُكُم مِّن دُونِ ٱلرَّحۡمَٰنِۚ إِنِ ٱلۡكَٰفِرُونَ إِلَّا فِي غُرُورٍ","أَمَّنۡ هَٰذَا ٱلَّذِي يَرۡزُقُكُمۡ إِنۡ أَمۡسَكَ رِزۡقَهُۥۚ بَل لَّجُّواْ فِي عُتُوّٖ وَنُفُورٍ","أَفَمَن يَمۡشِي مُكِبًّا عَلَىٰ وَجۡهِهِۦٓ أَهۡدَىٰٓ أَمَّن يَمۡشِي سَوِيًّا عَلَىٰ صِرَٰطٖ مُّسۡتَقِيمٖ","قُلۡ هُوَ ٱلَّذِيٓ أَنشَأَكُمۡ وَجَعَلَ لَكُمُ ٱلسَّمۡعَ وَٱلۡأَبۡصَٰرَ وَٱلۡأَفۡـِٔدَةَۚ قَلِيلٗا مَّا تَشۡكُرُونَ","قُلۡ هُوَ ٱلَّذِي ذَرَأَكُمۡ فِي ٱلۡأَرۡضِ وَإِلَيۡهِ تُحۡشَرُونَ","وَيَقُولُونَ مَتَىٰ هَٰذَا ٱلۡوَعۡدُ إِن كُنتُمۡ صَٰدِقِينَ","قُلۡ إِنَّمَا ٱلۡعِلۡمُ عِندَ ٱللَّهِ وَإِنَّمَآ أَنَا۠ نَذِيرٞ مُّبِينٞ","فَلَمَّا رَأَوۡهُ زُلۡفَةٗ سِيٓـَٔتۡ وُجُوهُ ٱلَّذِينَ كَفَرُواْ وَقِيلَ هَٰذَا ٱلَّذِي كُنتُم بِهِۦ تَدَّعُونَ","قُلۡ أَرَءَيۡتُمۡ إِنۡ أَهۡلَكَنِيَ ٱللَّهُ وَمَن مَّعِيَ أَوۡ رَحِمَنَا فَمَن يُجِيرُ ٱلۡكَٰفِرِينَ مِنۡ عَذَابٍ أَلِيمٖ","قُلۡ هُوَ ٱلرَّحۡمَٰنُ ءَامَنَّا بِهِۦ وَعَلَيۡهِ تَوَكَّلۡنَاۖ فَسَتَعۡلَمُونَ مَنۡ هُوَ فِي ضَلَٰلٖ مُّبِينٖ","قُلۡ أَرَءَيۡتُمۡ إِنۡ أَصۡبَحَ مَآؤُكُمۡ غَوۡرٗا فَمَن يَأۡتِيكُم بِمَآءٖ مَّعِينِۭ"],"pool":["تَبَٰرَكَ ٱلَّذِي بِيَدِهِ ٱلۡمُلۡكُ وَهُوَ عَلَىٰ كُلِّ شَيۡءٖ قَدِيرٌ","ٱلَّذِي خَلَقَ ٱلۡمَوۡتَ وَٱلۡحَيَوٰةَ لِيَبۡلُوَكُمۡ أَيُّكُمۡ أَحۡسَنُ عَمَلٗاۚ وَهُوَ ٱلۡعَزِيزُ ٱلۡغَفُورُ","ٱلَّذِي خَلَقَ سَبۡعَ سَمَٰوَٰتٖ طِبَاقٗاۖ مَّا تَرَىٰ فِي خَلۡقِ ٱلرَّحۡمَٰنِ مِن تَفَٰوُتٖۖ فَٱرۡجِعِ ٱلۡبَصَرَ هَلۡ تَرَىٰ مِن فُطُورٖ","ثُمَّ ٱرۡجِعِ ٱلۡبَصَرَ كَرَّتَيۡنِ يَنقَلِبۡ إِلَيۡكَ ٱلۡبَصَرُ خَاسِئٗا وَهُوَ حَسِيرٞ","وَلَقَدۡ زَيَّنَّا ٱلسَّمَآءَ ٱلدُّنۡيَا بِمَصَٰبِيحَ وَجَعَلۡنَٰهَا رُجُومٗا لِّلشَّيَٰطِينِۖ وَأَعۡتَدۡنَا لَهُمۡ عَذَابَ ٱلسَّعِيرِ","وَلِلَّذِينَ كَفَرُواْ بِرَبِّهِمۡ عَذَابُ جَهَنَّمَۖ وَبِئۡسَ ٱلۡمَصِيرُ","إِذَآ أُلۡقُواْ فِيهَا سَمِعُواْ لَهَا شَهِيقٗا وَهِيَ تَفُورُ","تَكَادُ تَمَيَّزُ مِنَ ٱلۡغَيۡظِۖ كُلَّمَآ أُلۡقِيَ فِيهَا فَوۡجٞ سَأَلَهُمۡ خَزَنَتُهَآ أَلَمۡ يَأۡتِكُمۡ نَذِيرٞ","قَالُواْ بَلَىٰ قَدۡ جَآءَنَا نَذِيرٞ فَكَذَّبۡنَا وَقُلۡنَا مَا نَزَّلَ ٱللَّهُ مِن شَيۡءٍ إِنۡ أَنتُمۡ إِلَّا فِي ضَلَٰلٖ كَبِيرٖ","وَقَالُواْ لَوۡ كُنَّا نَسۡمَعُ أَوۡ نَعۡقِلُ مَا كُنَّا فِيٓ أَصۡحَٰبِ ٱلسَّعِيرِ","فَٱعۡتَرَفُواْ بِذَنۢبِهِمۡ فَسُحۡقٗا لِّأَصۡحَٰبِ ٱلسَّعِيرِ","إِنَّ ٱلَّذِينَ يَخۡشَوۡنَ رَبَّهُم بِٱلۡغَيۡبِ لَهُم مَّغۡفِرَةٞ وَأَجۡرٞ كَبِيرٞ","وَأَسِرُّواْ قَوۡلَكُمۡ أَوِ ٱجۡهَرُواْ بِهِۦٓۖ إِنَّهُۥ عَلِيمُۢ بِذَاتِ ٱلصُّدُورِ","أَلَا يَعۡلَمُ مَنۡ خَلَقَ وَهُوَ ٱللَّطِيفُ ٱلۡخَبِيرُ","هُوَ ٱلَّذِي جَعَلَ لَكُمُ ٱلۡأَرۡضَ ذَلُولٗا فَٱمۡشُواْ فِي مَنَاكِبِهَا وَكُلُواْ مِن رِّزۡقِهِۦۖ وَإِلَيۡهِ ٱلنُّشُورُ","ءَأَمِنتُم مَّن فِي ٱلسَّمَآءِ أَن يَخۡسِفَ بِكُمُ ٱلۡأَرۡضَ فَإِذَا هِيَ تَمُورُ","أَمۡ أَمِنتُم مَّن فِي ٱلسَّمَآءِ أَن يُرۡسِلَ عَلَيۡكُمۡ حَاصِبٗاۖ فَسَتَعۡلَمُونَ كَيۡفَ نَذِيرِ","وَلَقَدۡ كَذَّبَ ٱلَّذِينَ مِن قَبۡلِهِمۡ فَكَيۡفَ كَانَ نَكِيرِ","أَوَلَمۡ يَرَوۡاْ إِلَى ٱلطَّيۡرِ فَوۡقَهُمۡ صَـٰٓفَّـٰتٖ وَيَقۡبِضۡنَۚ مَا يُمۡسِكُهُنَّ إِلَّا ٱلرَّحۡمَٰنُۚ إِنَّهُۥ بِكُلِّ شَيۡءِۭ بَصِيرٌ","أَمَّنۡ هَٰذَا ٱلَّذِي هُوَ جُندٞ لَّكُمۡ يَنصُرُكُم مِّن دُونِ ٱلرَّحۡمَٰنِۚ إِنِ ٱلۡكَٰفِرُونَ إِلَّا فِي غُرُورٍ","أَمَّنۡ هَٰذَا ٱلَّذِي يَرۡزُقُكُمۡ إِنۡ أَمۡسَكَ رِزۡقَهُۥۚ بَل لَّجُّواْ فِي عُتُوّٖ وَنُفُورٍ","أَفَمَن يَمۡشِي مُكِبًّا عَلَىٰ وَجۡهِهِۦٓ أَهۡدَىٰٓ أَمَّن يَمۡشِي سَوِيًّا عَلَىٰ صِرَٰطٖ مُّسۡتَقِيمٖ","قُلۡ هُوَ ٱلَّذِيٓ أَنشَأَكُمۡ وَجَعَلَ لَكُمُ ٱلسَّمۡعَ وَٱلۡأَبۡصَٰرَ وَٱلۡأَفۡـِٔدَةَۚ قَلِيلٗا مَّا تَشۡكُرُونَ","قُلۡ هُوَ ٱلَّذِي ذَرَأَكُمۡ فِي ٱلۡأَرۡضِ وَإِلَيۡهِ تُحۡشَرُونَ","وَيَقُولُونَ مَتَىٰ هَٰذَا ٱلۡوَعۡدُ إِن كُنتُمۡ صَٰدِقِينَ","قُلۡ إِنَّمَا ٱلۡعِلۡمُ عِندَ ٱللَّهِ وَإِنَّمَآ أَنَا۠ نَذِيرٞ مُّبِينٞ","فَلَمَّا رَأَوۡهُ زُلۡفَةٗ سِيٓـَٔتۡ وُجُوهُ ٱلَّذِينَ كَفَرُواْ وَقِيلَ هَٰذَا ٱلَّذِي كُنتُم بِهِۦ تَدَّعُونَ","قُلۡ أَرَءَيۡتُمۡ إِنۡ أَهۡلَكَنِيَ ٱللَّهُ وَمَن مَّعِيَ أَوۡ رَحِمَنَا فَمَن يُجِيرُ ٱلۡكَٰفِرِينَ مِنۡ عَذَابٍ أَلِيمٖ","قُلۡ هُوَ ٱلرَّحۡمَٰنُ ءَامَنَّا بِهِۦ وَعَلَيۡهِ تَوَكَّلۡنَاۖ فَسَتَعۡلَمُونَ مَنۡ هُوَ فِي ضَلَٰلٖ مُّبِينٖ","قُلۡ أَرَءَيۡتُمۡ إِنۡ أَصۡبَحَ مَآؤُكُمۡ غَوۡرٗا فَمَن يَأۡتِيكُم بِمَآءٖ مَّعِينِۭ","نٓۚ وَٱلۡقَلَمِ وَمَا يَسۡطُرُونَ","مَآ أَنتَ بِنِعۡمَةِ رَبِّكَ بِمَجۡنُونٖ","وَإِنَّ لَكَ لَأَجۡرًا غَيۡرَ مَمۡنُونٖ","وَإِنَّكَ لَعَلَىٰ خُلُقٍ عَظِيمٖ","فَسَتُبۡصِرُ وَيُبۡصِرُونَ","بِأَييِّكُمُ ٱلۡمَفۡتُونُ","إِنَّ رَبَّكَ هُوَ أَعۡلَمُ بِمَن ضَلَّ عَن سَبِيلِهِۦ وَهُوَ أَعۡلَمُ بِٱلۡمُهۡتَدِينَ","فَلَا تُطِعِ ٱلۡمُكَذِّبِينَ","وَدُّواْ لَوۡ تُدۡهِنُ فَيُدۡهِنُونَ","وَلَا تُطِعۡ كُلَّ حَلَّافٖ مَّهِينٍ","هَمَّازٖ مَّشَّآءِۭ بِنَمِيمٖ","مَّنَّاعٖ لِّلۡخَيۡرِ مُعۡتَدٍ أَثِيمٍ","عُتُلِّۭ بَعۡدَ ذَٰلِكَ زَنِيمٍ","أَن كَانَ ذَا مَالٖ وَبَنِينَ","إِذَا تُتۡلَىٰ عَلَيۡهِ ءَايَٰتُنَا قَالَ أَسَٰطِيرُ ٱلۡأَوَّلِينَ","سَنَسِمُهُۥ عَلَى ٱلۡخُرۡطُومِ","إِنَّا بَلَوۡنَٰهُمۡ كَمَا بَلَوۡنَآ أَصۡحَٰبَ ٱلۡجَنَّةِ إِذۡ أَقۡسَمُواْ لَيَصۡرِمُنَّهَا مُصۡبِحِينَ","وَلَا يَسۡتَثۡنُونَ","فَطَافَ عَلَيۡهَا طَآئِفٞ مِّن رَّبِّكَ وَهُمۡ نَآئِمُونَ","فَأَصۡبَحَتۡ كَٱلصَّرِيمِ","فَتَنَادَوۡاْ مُصۡبِحِينَ","أَنِ ٱغۡدُواْ عَلَىٰ حَرۡثِكُمۡ إِن كُنتُمۡ صَٰرِمِينَ","فَٱنطَلَقُواْ وَهُمۡ يَتَخَٰفَتُونَ","أَن لَّا يَدۡخُلَنَّهَا ٱلۡيَوۡمَ عَلَيۡكُم مِّسۡكِينٞ","وَغَدَوۡاْ عَلَىٰ حَرۡدٖ قَٰدِرِينَ","فَلَمَّا رَأَوۡهَا قَالُوٓاْ إِنَّا لَضَآلُّونَ","بَلۡ نَحۡنُ مَحۡرُومُونَ","قَالَ أَوۡسَطُهُمۡ أَلَمۡ أَقُل لَّكُمۡ لَوۡلَا تُسَبِّحُونَ","قَالُواْ سُبۡحَٰنَ رَبِّنَآ إِنَّا كُنَّا ظَٰلِمِينَ","فَأَقۡبَلَ بَعۡضُهُمۡ عَلَىٰ بَعۡضٖ يَتَلَٰوَمُونَ","قَالُواْ يَٰوَيۡلَنَآ إِنَّا كُنَّا طَٰغِينَ","عَسَىٰ رَبُّنَآ أَن يُبۡدِلَنَا خَيۡرٗا مِّنۡهَآ إِنَّآ إِلَىٰ رَبِّنَا رَٰغِبُونَ","كَذَٰلِكَ ٱلۡعَذَابُۖ وَلَعَذَابُ ٱلۡأٓخِرَةِ أَكۡبَرُۚ لَوۡ كَانُواْ يَعۡلَمُونَ","إِنَّ لِلۡمُتَّقِينَ عِندَ رَبِّهِمۡ جَنَّـٰتِ ٱلنَّعِيمِ","أَفَنَجۡعَلُ ٱلۡمُسۡلِمِينَ كَٱلۡمُجۡرِمِينَ","مَا لَكُمۡ كَيۡفَ تَحۡكُمُونَ","أَمۡ لَكُمۡ كِتَٰبٞ فِيهِ تَدۡرُسُونَ","إِنَّ لَكُمۡ فِيهِ لَمَا تَخَيَّرُونَ","أَمۡ لَكُمۡ أَيۡمَٰنٌ عَلَيۡنَا بَٰلِغَةٌ إِلَىٰ يَوۡمِ ٱلۡقِيَٰمَةِ إِنَّ لَكُمۡ لَمَا تَحۡكُمُونَ","سَلۡهُمۡ أَيُّهُم بِذَٰلِكَ زَعِيمٌ","أَمۡ لَهُمۡ شُرَكَآءُ فَلۡيَأۡتُواْ بِشُرَكَآئِهِمۡ إِن كَانُواْ صَٰدِقِينَ","يَوۡمَ يُكۡشَفُ عَن سَاقٖ وَيُدۡعَوۡنَ إِلَى ٱلسُّجُودِ فَلَا يَسۡتَطِيعُونَ","خَٰشِعَةً أَبۡصَٰرُهُمۡ تَرۡهَقُهُمۡ ذِلَّةٞۖ وَقَدۡ كَانُواْ يُدۡعَوۡنَ إِلَى ٱلسُّجُودِ وَهُمۡ سَٰلِمُونَ","فَذَرۡنِي وَمَن يُكَذِّبُ بِهَٰذَا ٱلۡحَدِيثِۖ سَنَسۡتَدۡرِجُهُم مِّنۡ حَيۡثُ لَا يَعۡلَمُونَ","وَأُمۡلِي لَهُمۡۚ إِنَّ كَيۡدِي مَتِينٌ","أَمۡ تَسۡـَٔلُهُمۡ أَجۡرٗا فَهُم مِّن مَّغۡرَمٖ مُّثۡقَلُونَ","أَمۡ عِندَهُمُ ٱلۡغَيۡبُ فَهُمۡ يَكۡتُبُونَ","فَٱصۡبِرۡ لِحُكۡمِ رَبِّكَ وَلَا تَكُن كَصَاحِبِ ٱلۡحُوتِ إِذۡ نَادَىٰ وَهُوَ مَكۡظُومٞ","لَّوۡلَآ أَن تَدَٰرَكَهُۥ نِعۡمَةٞ مِّن رَّبِّهِۦ لَنُبِذَ بِٱلۡعَرَآءِ وَهُوَ مَذۡمُومٞ","فَٱجۡتَبَٰهُ رَبُّهُۥ فَجَعَلَهُۥ مِنَ ٱلصَّـٰلِحِينَ","وَإِن يَكَادُ ٱلَّذِينَ كَفَرُواْ لَيُزۡلِقُونَكَ بِأَبۡصَٰرِهِمۡ لَمَّا سَمِعُواْ ٱلذِّكۡرَ وَيَقُولُونَ إِنَّهُۥ لَمَجۡنُونٞ","وَمَا هُوَ إِلَّا ذِكۡرٞ لِّلۡعَٰلَمِينَ","ٱلۡحَآقَّةُ","مَا ٱلۡحَآقَّةُ","وَمَآ أَدۡرَىٰكَ مَا ٱلۡحَآقَّةُ","كَذَّبَتۡ ثَمُودُ وَعَادُۢ بِٱلۡقَارِعَةِ","فَأَمَّا ثَمُودُ فَأُهۡلِكُواْ بِٱلطَّاغِيَةِ","وَأَمَّا عَادٞ فَأُهۡلِكُواْ بِرِيحٖ صَرۡصَرٍ عَاتِيَةٖ","سَخَّرَهَا عَلَيۡهِمۡ سَبۡعَ لَيَالٖ وَثَمَٰنِيَةَ أَيَّامٍ حُسُومٗاۖ فَتَرَى ٱلۡقَوۡمَ فِيهَا صَرۡعَىٰ كَأَنَّهُمۡ أَعۡجَازُ نَخۡلٍ خَاوِيَةٖ","فَهَلۡ تَرَىٰ لَهُم مِّنۢ بَاقِيَةٖ","وَجَآءَ فِرۡعَوۡنُ وَمَن قَبۡلَهُۥ وَٱلۡمُؤۡتَفِكَٰتُ بِٱلۡخَاطِئَةِ","فَعَصَوۡاْ رَسُولَ رَبِّهِمۡ فَأَخَذَهُمۡ أَخۡذَةٗ رَّابِيَةً","إِنَّا لَمَّا طَغَا ٱلۡمَآءُ حَمَلۡنَٰكُمۡ فِي ٱلۡجَارِيَةِ","لِنَجۡعَلَهَا لَكُمۡ تَذۡكِرَةٗ وَتَعِيَهَآ أُذُنٞ وَٰعِيَةٞ","فَإِذَا نُفِخَ فِي ٱلصُّورِ نَفۡخَةٞ وَٰحِدَةٞ","وَحُمِلَتِ ٱلۡأَرۡضُ وَٱلۡجِبَالُ فَدُكَّتَا دَكَّةٗ وَٰحِدَةٗ","فَيَوۡمَئِذٖ وَقَعَتِ ٱلۡوَاقِعَةُ","وَٱنشَقَّتِ ٱلسَّمَآءُ فَهِيَ يَوۡمَئِذٖ وَاهِيَةٞ","وَٱلۡمَلَكُ عَلَىٰٓ أَرۡجَآئِهَاۚ وَيَحۡمِلُ عَرۡشَ رَبِّكَ فَوۡقَهُمۡ يَوۡمَئِذٖ ثَمَٰنِيَةٞ","يَوۡمَئِذٖ تُعۡرَضُونَ لَا تَخۡفَىٰ مِنكُمۡ خَافِيَةٞ","فَأَمَّا مَنۡ أُوتِيَ كِتَٰبَهُۥ بِيَمِينِهِۦ فَيَقُولُ هَآؤُمُ ٱقۡرَءُواْ كِتَٰبِيَهۡ","إِنِّي ظَنَنتُ أَنِّي مُلَٰقٍ حِسَابِيَهۡ","فَهُوَ فِي عِيشَةٖ رَّاضِيَةٖ","فِي جَنَّةٍ عَالِيَةٖ","قُطُوفُهَا دَانِيَةٞ","كُلُواْ وَٱشۡرَبُواْ هَنِيٓـَٔۢا بِمَآ أَسۡلَفۡتُمۡ فِي ٱلۡأَيَّامِ ٱلۡخَالِيَةِ","وَأَمَّا مَنۡ أُوتِيَ كِتَٰبَهُۥ بِشِمَالِهِۦ فَيَقُولُ يَٰلَيۡتَنِي لَمۡ أُوتَ كِتَٰبِيَهۡ","وَلَمۡ أَدۡرِ مَا حِسَابِيَهۡ","يَٰلَيۡتَهَا كَانَتِ ٱلۡقَاضِيَةَ","مَآ أَغۡنَىٰ عَنِّي مَالِيَهۡۜ","هَلَكَ عَنِّي سُلۡطَٰنِيَهۡ","خُذُوهُ فَغُلُّوهُ","ثُمَّ ٱلۡجَحِيمَ صَلُّوهُ","ثُمَّ فِي سِلۡسِلَةٖ ذَرۡعُهَا سَبۡعُونَ ذِرَاعٗا فَٱسۡلُكُوهُ","إِنَّهُۥ كَانَ لَا يُؤۡمِنُ بِٱللَّهِ ٱلۡعَظِيمِ","وَلَا يَحُضُّ عَلَىٰ طَعَامِ ٱلۡمِسۡكِينِ","فَلَيۡسَ لَهُ ٱلۡيَوۡمَ هَٰهُنَا حَمِيمٞ","وَلَا طَعَامٌ إِلَّا مِنۡ غِسۡلِينٖ","لَّا يَأۡكُلُهُۥٓ إِلَّا ٱلۡخَٰطِـُٔونَ","فَلَآ أُقۡسِمُ بِمَا تُبۡصِرُونَ","وَمَا لَا تُبۡصِرُونَ","إِنَّهُۥ لَقَوۡلُ رَسُولٖ كَرِيمٖ","وَمَا هُوَ بِقَوۡلِ شَاعِرٖۚ قَلِيلٗا مَّا تُؤۡمِنُونَ","وَلَا بِقَوۡلِ كَاهِنٖۚ قَلِيلٗا مَّا تَذَكَّرُونَ","تَنزِيلٞ مِّن رَّبِّ ٱلۡعَٰلَمِينَ","وَلَوۡ تَقَوَّلَ عَلَيۡنَا بَعۡضَ ٱلۡأَقَاوِيلِ","لَأَخَذۡنَا مِنۡهُ بِٱلۡيَمِينِ","ثُمَّ لَقَطَعۡنَا مِنۡهُ ٱلۡوَتِينَ","فَمَا مِنكُم مِّنۡ أَحَدٍ عَنۡهُ حَٰجِزِينَ","وَإِنَّهُۥ لَتَذۡكِرَةٞ لِّلۡمُتَّقِينَ","وَإِنَّا لَنَعۡلَمُ أَنَّ مِنكُم مُّكَذِّبِينَ","وَإِنَّهُۥ لَحَسۡرَةٌ عَلَى ٱلۡكَٰفِرِينَ","وَإِنَّهُۥ لَحَقُّ ٱلۡيَقِينِ","فَسَبِّحۡ بِٱسۡمِ رَبِّكَ ٱلۡعَظِيمِ","سَأَلَ سَآئِلُۢ بِعَذَابٖ وَاقِعٖ","لِّلۡكَٰفِرِينَ لَيۡسَ لَهُۥ دَافِعٞ","مِّنَ ٱللَّهِ ذِي ٱلۡمَعَارِجِ","تَعۡرُجُ ٱلۡمَلَـٰٓئِكَةُ وَٱلرُّوحُ إِلَيۡهِ فِي يَوۡمٖ كَانَ مِقۡدَارُهُۥ خَمۡسِينَ أَلۡفَ سَنَةٖ","فَٱصۡبِرۡ صَبۡرٗا جَمِيلًا","إِنَّهُمۡ يَرَوۡنَهُۥ بَعِيدٗا","وَنَرَىٰهُ قَرِيبٗا","يَوۡمَ تَكُونُ ٱلسَّمَآءُ كَٱلۡمُهۡلِ","وَتَكُونُ ٱلۡجِبَالُ كَٱلۡعِهۡنِ","وَلَا يَسۡـَٔلُ حَمِيمٌ حَمِيمٗا","يُبَصَّرُونَهُمۡۚ يَوَدُّ ٱلۡمُجۡرِمُ لَوۡ يَفۡتَدِي مِنۡ عَذَابِ يَوۡمِئِذِۭ بِبَنِيهِ","وَصَٰحِبَتِهِۦ وَأَخِيهِ","وَفَصِيلَتِهِ ٱلَّتِي تُـٔۡوِيهِ","وَمَن فِي ٱلۡأَرۡضِ جَمِيعٗا ثُمَّ يُنجِيهِ","كَلَّآۖ إِنَّهَا لَظَىٰ","نَزَّاعَةٗ لِّلشَّوَىٰ","تَدۡعُواْ مَنۡ أَدۡبَرَ وَتَوَلَّىٰ","وَجَمَعَ فَأَوۡعَىٰٓ","۞إِنَّ ٱلۡإِنسَٰنَ خُلِقَ هَلُوعًا","إِذَا مَسَّهُ ٱلشَّرُّ جَزُوعٗا","وَإِذَا مَسَّهُ ٱلۡخَيۡرُ مَنُوعًا","إِلَّا ٱلۡمُصَلِّينَ","ٱلَّذِينَ هُمۡ عَلَىٰ صَلَاتِهِمۡ دَآئِمُونَ","وَٱلَّذِينَ فِيٓ أَمۡوَٰلِهِمۡ حَقّٞ مَّعۡلُومٞ","لِّلسَّآئِلِ وَٱلۡمَحۡرُومِ","وَٱلَّذِينَ يُصَدِّقُونَ بِيَوۡمِ ٱلدِّينِ","وَٱلَّذِينَ هُم مِّنۡ عَذَابِ رَبِّهِم مُّشۡفِقُونَ","إِنَّ عَذَابَ رَبِّهِمۡ غَيۡرُ مَأۡمُونٖ","وَٱلَّذِينَ هُمۡ لِفُرُوجِهِمۡ حَٰفِظُونَ","إِلَّا عَلَىٰٓ أَزۡوَٰجِهِمۡ أَوۡ مَا مَلَكَتۡ أَيۡمَٰنُهُمۡ فَإِنَّهُمۡ غَيۡرُ مَلُومِينَ","فَمَنِ ٱبۡتَغَىٰ وَرَآءَ ذَٰلِكَ فَأُوْلَـٰٓئِكَ هُمُ ٱلۡعَادُونَ","وَٱلَّذِينَ هُمۡ لِأَمَٰنَٰتِهِمۡ وَعَهۡدِهِمۡ رَٰعُونَ","وَٱلَّذِينَ هُم بِشَهَٰدَٰتِهِمۡ قَآئِمُونَ","وَٱلَّذِينَ هُمۡ عَلَىٰ صَلَاتِهِمۡ يُحَافِظُونَ","أُوْلَـٰٓئِكَ فِي جَنَّـٰتٖ مُّكۡرَمُونَ","فَمَالِ ٱلَّذِينَ كَفَرُواْ قِبَلَكَ مُهۡطِعِينَ","عَنِ ٱلۡيَمِينِ وَعَنِ ٱلشِّمَالِ عِزِينَ","أَيَطۡمَعُ كُلُّ ٱمۡرِيٕٖ مِّنۡهُمۡ أَن يُدۡخَلَ جَنَّةَ نَعِيمٖ","كَلَّآۖ إِنَّا خَلَقۡنَٰهُم مِّمَّا يَعۡلَمُونَ","فَلَآ أُقۡسِمُ بِرَبِّ ٱلۡمَشَٰرِقِ وَٱلۡمَغَٰرِبِ إِنَّا لَقَٰدِرُونَ","عَلَىٰٓ أَن نُّبَدِّلَ خَيۡرٗا مِّنۡهُمۡ وَمَا نَحۡنُ بِمَسۡبُوقِينَ","فَذَرۡهُمۡ يَخُوضُواْ وَيَلۡعَبُواْ حَتَّىٰ يُلَٰقُواْ يَوۡمَهُمُ ٱلَّذِي يُوعَدُونَ","يَوۡمَ يَخۡرُجُونَ مِنَ ٱلۡأَجۡدَاثِ سِرَاعٗا كَأَنَّهُمۡ إِلَىٰ نُصُبٖ يُوفِضُونَ","خَٰشِعَةً أَبۡصَٰرُهُمۡ تَرۡهَقُهُمۡ ذِلَّةٞۚ ذَٰلِكَ ٱلۡيَوۡمُ ٱلَّذِي كَانُواْ يُوعَدُونَ","إِنَّآ أَرۡسَلۡنَا نُوحًا إِلَىٰ قَوۡمِهِۦٓ أَنۡ أَنذِرۡ قَوۡمَكَ مِن قَبۡلِ أَن يَأۡتِيَهُمۡ عَذَابٌ أَلِيمٞ","قَالَ يَٰقَوۡمِ إِنِّي لَكُمۡ نَذِيرٞ مُّبِينٌ","أَنِ ٱعۡبُدُواْ ٱللَّهَ وَٱتَّقُوهُ وَأَطِيعُونِ","يَغۡفِرۡ لَكُم مِّن ذُنُوبِكُمۡ وَيُؤَخِّرۡكُمۡ إِلَىٰٓ أَجَلٖ مُّسَمًّىۚ إِنَّ أَجَلَ ٱللَّهِ إِذَا جَآءَ لَا يُؤَخَّرُۚ لَوۡ كُنتُمۡ تَعۡلَمُونَ","قَالَ رَبِّ إِنِّي دَعَوۡتُ قَوۡمِي لَيۡلٗا وَنَهَارٗا","فَلَمۡ يَزِدۡهُمۡ دُعَآءِيٓ إِلَّا فِرَارٗا","وَإِنِّي كُلَّمَا دَعَوۡتُهُمۡ لِتَغۡفِرَ لَهُمۡ جَعَلُوٓاْ أَصَٰبِعَهُمۡ فِيٓ ءَاذَانِهِمۡ وَٱسۡتَغۡشَوۡاْ ثِيَابَهُمۡ وَأَصَرُّواْ وَٱسۡتَكۡبَرُواْ ٱسۡتِكۡبَارٗا","ثُمَّ إِنِّي دَعَوۡتُهُمۡ جِهَارٗا","ثُمَّ إِنِّيٓ أَعۡلَنتُ لَهُمۡ وَأَسۡرَرۡتُ لَهُمۡ إِسۡرَارٗا","فَقُلۡتُ ٱسۡتَغۡفِرُواْ رَبَّكُمۡ إِنَّهُۥ كَانَ غَفَّارٗا","يُرۡسِلِ ٱلسَّمَآءَ عَلَيۡكُم مِّدۡرَارٗا","وَيُمۡدِدۡكُم بِأَمۡوَٰلٖ وَبَنِينَ وَيَجۡعَل لَّكُمۡ جَنَّـٰتٖ وَيَجۡعَل لَّكُمۡ أَنۡهَٰرٗا","مَّا لَكُمۡ لَا تَرۡجُونَ لِلَّهِ وَقَارٗا","وَقَدۡ خَلَقَكُمۡ أَطۡوَارًا","أَلَمۡ تَرَوۡاْ كَيۡفَ خَلَقَ ٱللَّهُ سَبۡعَ سَمَٰوَٰتٖ طِبَاقٗا","وَجَعَلَ ٱلۡقَمَرَ فِيهِنَّ نُورٗا وَجَعَلَ ٱلشَّمۡسَ سِرَاجٗا","وَٱللَّهُ أَنۢبَتَكُم مِّنَ ٱلۡأَرۡضِ نَبَاتٗا","ثُمَّ يُعِيدُكُمۡ فِيهَا وَيُخۡرِجُكُمۡ إِخۡرَاجٗا","وَٱللَّهُ جَعَلَ لَكُمُ ٱلۡأَرۡضَ بِسَاطٗا","لِّتَسۡلُكُواْ مِنۡهَا سُبُلٗا فِجَاجٗا","قَالَ نُوحٞ رَّبِّ إِنَّهُمۡ عَصَوۡنِي وَٱتَّبَعُواْ مَن لَّمۡ يَزِدۡهُ مَالُهُۥ وَوَلَدُهُۥٓ إِلَّا خَسَارٗا","وَمَكَرُواْ مَكۡرٗا كُبَّارٗا","وَقَالُواْ لَا تَذَرُنَّ ءَالِهَتَكُمۡ وَلَا تَذَرُنَّ وَدّٗا وَلَا سُوَاعٗا وَلَا يَغُوثَ وَيَعُوقَ وَنَسۡرٗا","وَقَدۡ أَضَلُّواْ كَثِيرٗاۖ وَلَا تَزِدِ ٱلظَّـٰلِمِينَ إِلَّا ضَلَٰلٗا","مِّمَّا خَطِيٓـَٰٔتِهِمۡ أُغۡرِقُواْ فَأُدۡخِلُواْ نَارٗا فَلَمۡ يَجِدُواْ لَهُم مِّن دُونِ ٱللَّهِ أَنصَارٗا","وَقَالَ نُوحٞ رَّبِّ لَا تَذَرۡ عَلَى ٱلۡأَرۡضِ مِنَ ٱلۡكَٰفِرِينَ دَيَّارًا","إِنَّكَ إِن تَذَرۡهُمۡ يُضِلُّواْ عِبَادَكَ وَلَا يَلِدُوٓاْ إِلَّا فَاجِرٗا كَفَّارٗا","رَّبِّ ٱغۡفِرۡ لِي وَلِوَٰلِدَيَّ وَلِمَن دَخَلَ بَيۡتِيَ مُؤۡمِنٗا وَلِلۡمُؤۡمِنِينَ وَٱلۡمُؤۡمِنَٰتِۖ وَلَا تَزِدِ ٱلظَّـٰلِمِينَ إِلَّا تَبَارَۢا","قُلۡ أُوحِيَ إِلَيَّ أَنَّهُ ٱسۡتَمَعَ نَفَرٞ مِّنَ ٱلۡجِنِّ فَقَالُوٓاْ إِنَّا سَمِعۡنَا قُرۡءَانًا عَجَبٗا","يَهۡدِيٓ إِلَى ٱلرُّشۡدِ فَـَٔامَنَّا بِهِۦۖ وَلَن نُّشۡرِكَ بِرَبِّنَآ أَحَدٗا","وَأَنَّهُۥ تَعَٰلَىٰ جَدُّ رَبِّنَا مَا ٱتَّخَذَ صَٰحِبَةٗ وَلَا وَلَدٗا","وَأَنَّهُۥ كَانَ يَقُولُ سَفِيهُنَا عَلَى ٱللَّهِ شَطَطٗا","وَأَنَّا ظَنَنَّآ أَن لَّن تَقُولَ ٱلۡإِنسُ وَٱلۡجِنُّ عَلَى ٱللَّهِ كَذِبٗا","وَأَنَّهُۥ كَانَ رِجَالٞ مِّنَ ٱلۡإِنسِ يَعُوذُونَ بِرِجَالٖ مِّنَ ٱلۡجِنِّ فَزَادُوهُمۡ رَهَقٗا","وَأَنَّهُمۡ ظَنُّواْ كَمَا ظَنَنتُمۡ أَن لَّن يَبۡعَثَ ٱللَّهُ أَحَدٗا","وَأَنَّا لَمَسۡنَا ٱلسَّمَآءَ فَوَجَدۡنَٰهَا مُلِئَتۡ حَرَسٗا شَدِيدٗا وَشُهُبٗا","وَأَنَّا كُنَّا نَقۡعُدُ مِنۡهَا مَقَٰعِدَ لِلسَّمۡعِۖ فَمَن يَسۡتَمِعِ ٱلۡأٓنَ يَجِدۡ لَهُۥ شِهَابٗا رَّصَدٗا","وَأَنَّا لَا نَدۡرِيٓ أَشَرٌّ أُرِيدَ بِمَن فِي ٱلۡأَرۡضِ أَمۡ أَرَادَ بِهِمۡ رَبُّهُمۡ رَشَدٗا","وَأَنَّا مِنَّا ٱلصَّـٰلِحُونَ وَمِنَّا دُونَ ذَٰلِكَۖ كُنَّا طَرَآئِقَ قِدَدٗا","وَأَنَّا ظَنَنَّآ أَن لَّن نُّعۡجِزَ ٱللَّهَ فِي ٱلۡأَرۡضِ وَلَن نُّعۡجِزَهُۥ هَرَبٗا","وَأَنَّا لَمَّا سَمِعۡنَا ٱلۡهُدَىٰٓ ءَامَنَّا بِهِۦۖ فَمَن يُؤۡمِنۢ بِرَبِّهِۦ فَلَا يَخَافُ بَخۡسٗا وَلَا رَهَقٗا","وَأَنَّا مِنَّا ٱلۡمُسۡلِمُونَ وَمِنَّا ٱلۡقَٰسِطُونَۖ فَمَنۡ أَسۡلَمَ فَأُوْلَـٰٓئِكَ تَحَرَّوۡاْ رَشَدٗا","وَأَمَّا ٱلۡقَٰسِطُونَ فَكَانُواْ لِجَهَنَّمَ حَطَبٗا","وَأَلَّوِ ٱسۡتَقَٰمُواْ عَلَى ٱلطَّرِيقَةِ لَأَسۡقَيۡنَٰهُم مَّآءً غَدَقٗا","لِّنَفۡتِنَهُمۡ فِيهِۚ وَمَن يُعۡرِضۡ عَن ذِكۡرِ رَبِّهِۦ يَسۡلُكۡهُ عَذَابٗا صَعَدٗا","وَأَنَّ ٱلۡمَسَٰجِدَ لِلَّهِ فَلَا تَدۡعُواْ مَعَ ٱللَّهِ أَحَدٗا","وَأَنَّهُۥ لَمَّا قَامَ عَبۡدُ ٱللَّهِ يَدۡعُوهُ كَادُواْ يَكُونُونَ عَلَيۡهِ لِبَدٗا","قُلۡ إِنَّمَآ أَدۡعُواْ رَبِّي وَلَآ أُشۡرِكُ بِهِۦٓ أَحَدٗا","قُلۡ إِنِّي لَآ أَمۡلِكُ لَكُمۡ ضَرّٗا وَلَا رَشَدٗا","قُلۡ إِنِّي لَن يُجِيرَنِي مِنَ ٱللَّهِ أَحَدٞ وَلَنۡ أَجِدَ مِن دُونِهِۦ مُلۡتَحَدًا","إِلَّا بَلَٰغٗا مِّنَ ٱللَّهِ وَرِسَٰلَٰتِهِۦۚ وَمَن يَعۡصِ ٱللَّهَ وَرَسُولَهُۥ فَإِنَّ لَهُۥ نَارَ جَهَنَّمَ خَٰلِدِينَ فِيهَآ أَبَدًا","حَتَّىٰٓ إِذَا رَأَوۡاْ مَا يُوعَدُونَ فَسَيَعۡلَمُونَ مَنۡ أَضۡعَفُ نَاصِرٗا وَأَقَلُّ عَدَدٗا","قُلۡ إِنۡ أَدۡرِيٓ أَقَرِيبٞ مَّا تُوعَدُونَ أَمۡ يَجۡعَلُ لَهُۥ رَبِّيٓ أَمَدًا","عَٰلِمُ ٱلۡغَيۡبِ فَلَا يُظۡهِرُ عَلَىٰ غَيۡبِهِۦٓ أَحَدًا","إِلَّا مَنِ ٱرۡتَضَىٰ مِن رَّسُولٖ فَإِنَّهُۥ يَسۡلُكُ مِنۢ بَيۡنِ يَدَيۡهِ وَمِنۡ خَلۡفِهِۦ رَصَدٗا","لِّيَعۡلَمَ أَن قَدۡ أَبۡلَغُواْ رِسَٰلَٰتِ رَبِّهِمۡ وَأَحَاطَ بِمَا لَدَيۡهِمۡ وَأَحۡصَىٰ كُلَّ شَيۡءٍ عَدَدَۢا","يَـٰٓأَيُّهَا ٱلۡمُزَّمِّلُ","قُمِ ٱلَّيۡلَ إِلَّا قَلِيلٗا","نِّصۡفَهُۥٓ أَوِ ٱنقُصۡ مِنۡهُ قَلِيلًا","أَوۡ زِدۡ عَلَيۡهِ وَرَتِّلِ ٱلۡقُرۡءَانَ تَرۡتِيلًا","إِنَّا سَنُلۡقِي عَلَيۡكَ قَوۡلٗا ثَقِيلًا","إِنَّ نَاشِئَةَ ٱلَّيۡلِ هِيَ أَشَدُّ وَطۡـٔٗا وَأَقۡوَمُ قِيلًا","إِنَّ لَكَ فِي ٱلنَّهَارِ سَبۡحٗا طَوِيلٗا","وَٱذۡكُرِ ٱسۡمَ رَبِّكَ وَتَبَتَّلۡ إِلَيۡهِ تَبۡتِيلٗا","رَّبُّ ٱلۡمَشۡرِقِ وَٱلۡمَغۡرِبِ لَآ إِلَٰهَ إِلَّا هُوَ فَٱتَّخِذۡهُ وَكِيلٗا","وَٱصۡبِرۡ عَلَىٰ مَا يَقُولُونَ وَٱهۡجُرۡهُمۡ هَجۡرٗا جَمِيلٗا","وَذَرۡنِي وَٱلۡمُكَذِّبِينَ أُوْلِي ٱلنَّعۡمَةِ وَمَهِّلۡهُمۡ قَلِيلًا","إِنَّ لَدَيۡنَآ أَنكَالٗا وَجَحِيمٗا","وَطَعَامٗا ذَا غُصَّةٖ وَعَذَابًا أَلِيمٗا","يَوۡمَ تَرۡجُفُ ٱلۡأَرۡضُ وَٱلۡجِبَالُ وَكَانَتِ ٱلۡجِبَالُ كَثِيبٗا مَّهِيلًا","إِنَّآ أَرۡسَلۡنَآ إِلَيۡكُمۡ رَسُولٗا شَٰهِدًا عَلَيۡكُمۡ كَمَآ أَرۡسَلۡنَآ إِلَىٰ فِرۡعَوۡنَ رَسُولٗا","فَعَصَىٰ فِرۡعَوۡنُ ٱلرَّسُولَ فَأَخَذۡنَٰهُ أَخۡذٗا وَبِيلٗا","فَكَيۡفَ تَتَّقُونَ إِن كَفَرۡتُمۡ يَوۡمٗا يَجۡعَلُ ٱلۡوِلۡدَٰنَ شِيبًا","ٱلسَّمَآءُ مُنفَطِرُۢ بِهِۦۚ كَانَ وَعۡدُهُۥ مَفۡعُولًا","إِنَّ هَٰذِهِۦ تَذۡكِرَةٞۖ فَمَن شَآءَ ٱتَّخَذَ إِلَىٰ رَبِّهِۦ سَبِيلًا","۞إِنَّ رَبَّكَ يَعۡلَمُ أَنَّكَ تَقُومُ أَدۡنَىٰ مِن ثُلُثَيِ ٱلَّيۡلِ وَنِصۡفَهُۥ وَثُلُثَهُۥ وَطَآئِفَةٞ مِّنَ ٱلَّذِينَ مَعَكَۚ وَٱللَّهُ يُقَدِّرُ ٱلَّيۡلَ وَٱلنَّهَارَۚ عَلِمَ أَن لَّن تُحۡصُوهُ فَتَابَ عَلَيۡكُمۡۖ فَٱقۡرَءُواْ مَا تَيَسَّرَ مِنَ ٱلۡقُرۡءَانِۚ عَلِمَ أَن سَيَكُونُ مِنكُم مَّرۡضَىٰ وَءَاخَرُونَ يَضۡرِبُونَ فِي ٱلۡأَرۡضِ يَبۡتَغُونَ مِن فَضۡلِ ٱللَّهِ وَءَاخَرُونَ يُقَٰتِلُونَ فِي سَبِيلِ ٱللَّهِۖ فَٱقۡرَءُواْ مَا تَيَسَّرَ مِنۡهُۚ وَأَقِيمُواْ ٱلصَّلَوٰةَ وَءَاتُواْ ٱلزَّكَوٰةَ وَأَقۡرِضُواْ ٱللَّهَ قَرۡضًا حَسَنٗاۚ وَمَا تُقَدِّمُواْ لِأَنفُسِكُم مِّنۡ خَيۡرٖ تَجِدُوهُ عِندَ ٱللَّهِ هُوَ خَيۡرٗا وَأَعۡظَمَ أَجۡرٗاۚ وَٱسۡتَغۡفِرُواْ ٱللَّهَۖ إِنَّ ٱللَّهَ غَفُورٞ رَّحِيمُۢ","يَـٰٓأَيُّهَا ٱلۡمُدَّثِّرُ","قُمۡ فَأَنذِرۡ","وَرَبَّكَ فَكَبِّرۡ","وَثِيَابَكَ فَطَهِّرۡ","وَٱلرُّجۡزَ فَٱهۡجُرۡ","وَلَا تَمۡنُن تَسۡتَكۡثِرُ","وَلِرَبِّكَ فَٱصۡبِرۡ","فَإِذَا نُقِرَ فِي ٱلنَّاقُورِ","فَذَٰلِكَ يَوۡمَئِذٖ يَوۡمٌ عَسِيرٌ","عَلَى ٱلۡكَٰفِرِينَ غَيۡرُ يَسِيرٖ","ذَرۡنِي وَمَنۡ خَلَقۡتُ وَحِيدٗا","وَجَعَلۡتُ لَهُۥ مَالٗا مَّمۡدُودٗا","وَبَنِينَ شُهُودٗا","وَمَهَّدتُّ لَهُۥ تَمۡهِيدٗا","ثُمَّ يَطۡمَعُ أَنۡ أَزِيدَ","كَلَّآۖ إِنَّهُۥ كَانَ لِأٓيَٰتِنَا عَنِيدٗا","سَأُرۡهِقُهُۥ صَعُودًا","إِنَّهُۥ فَكَّرَ وَقَدَّرَ","فَقُتِلَ كَيۡفَ قَدَّرَ","ثُمَّ قُتِلَ كَيۡفَ قَدَّرَ","ثُمَّ نَظَرَ","ثُمَّ عَبَسَ وَبَسَرَ","ثُمَّ أَدۡبَرَ وَٱسۡتَكۡبَرَ","فَقَالَ إِنۡ هَٰذَآ إِلَّا سِحۡرٞ يُؤۡثَرُ","إِنۡ هَٰذَآ إِلَّا قَوۡلُ ٱلۡبَشَرِ","سَأُصۡلِيهِ سَقَرَ","وَمَآ أَدۡرَىٰكَ مَا سَقَرُ","لَا تُبۡقِي وَلَا تَذَرُ","لَوَّاحَةٞ لِّلۡبَشَرِ","عَلَيۡهَا تِسۡعَةَ عَشَرَ","وَمَا جَعَلۡنَآ أَصۡحَٰبَ ٱلنَّارِ إِلَّا مَلَـٰٓئِكَةٗۖ وَمَا جَعَلۡنَا عِدَّتَهُمۡ إِلَّا فِتۡنَةٗ لِّلَّذِينَ كَفَرُواْ لِيَسۡتَيۡقِنَ ٱلَّذِينَ أُوتُواْ ٱلۡكِتَٰبَ وَيَزۡدَادَ ٱلَّذِينَ ءَامَنُوٓاْ إِيمَٰنٗا وَلَا يَرۡتَابَ ٱلَّذِينَ أُوتُواْ ٱلۡكِتَٰبَ وَٱلۡمُؤۡمِنُونَ وَلِيَقُولَ ٱلَّذِينَ فِي قُلُوبِهِم مَّرَضٞ وَٱلۡكَٰفِرُونَ مَاذَآ أَرَادَ ٱللَّهُ بِهَٰذَا مَثَلٗاۚ كَذَٰلِكَ يُضِلُّ ٱللَّهُ مَن يَشَآءُ وَيَهۡدِي مَن يَشَآءُۚ وَمَا يَعۡلَمُ جُنُودَ رَبِّكَ إِلَّا هُوَۚ وَمَا هِيَ إِلَّا ذِكۡرَىٰ لِلۡبَشَرِ","كَلَّا وَٱلۡقَمَرِ","وَٱلَّيۡلِ إِذۡ أَدۡبَرَ","وَٱلصُّبۡحِ إِذَآ أَسۡفَرَ","إِنَّهَا لَإِحۡدَى ٱلۡكُبَرِ","نَذِيرٗا لِّلۡبَشَرِ","لِمَن شَآءَ مِنكُمۡ أَن يَتَقَدَّمَ أَوۡ يَتَأَخَّرَ","كُلُّ نَفۡسِۭ بِمَا كَسَبَتۡ رَهِينَةٌ","إِلَّآ أَصۡحَٰبَ ٱلۡيَمِينِ","فِي جَنَّـٰتٖ يَتَسَآءَلُونَ","عَنِ ٱلۡمُجۡرِمِينَ","مَا سَلَكَكُمۡ فِي سَقَرَ","قَالُواْ لَمۡ نَكُ مِنَ ٱلۡمُصَلِّينَ","وَلَمۡ نَكُ نُطۡعِمُ ٱلۡمِسۡكِينَ","وَكُنَّا نَخُوضُ مَعَ ٱلۡخَآئِضِينَ","وَكُنَّا نُكَذِّبُ بِيَوۡمِ ٱلدِّينِ","حَتَّىٰٓ أَتَىٰنَا ٱلۡيَقِينُ","فَمَا تَنفَعُهُمۡ شَفَٰعَةُ ٱلشَّـٰفِعِينَ","فَمَا لَهُمۡ عَنِ ٱلتَّذۡكِرَةِ مُعۡرِضِينَ","كَأَنَّهُمۡ حُمُرٞ مُّسۡتَنفِرَةٞ","فَرَّتۡ مِن قَسۡوَرَةِۭ","بَلۡ يُرِيدُ كُلُّ ٱمۡرِيٕٖ مِّنۡهُمۡ أَن يُؤۡتَىٰ صُحُفٗا مُّنَشَّرَةٗ","كَلَّاۖ بَل لَّا يَخَافُونَ ٱلۡأٓخِرَةَ","كَلَّآ إِنَّهُۥ تَذۡكِرَةٞ","فَمَن شَآءَ ذَكَرَهُۥ","وَمَا يَذۡكُرُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُۚ هُوَ أَهۡلُ ٱلتَّقۡوَىٰ وَأَهۡلُ ٱلۡمَغۡفِرَةِ","لَآ أُقۡسِمُ بِيَوۡمِ ٱلۡقِيَٰمَةِ","وَلَآ أُقۡسِمُ بِٱلنَّفۡسِ ٱللَّوَّامَةِ","أَيَحۡسَبُ ٱلۡإِنسَٰنُ أَلَّن نَّجۡمَعَ عِظَامَهُۥ","بَلَىٰ قَٰدِرِينَ عَلَىٰٓ أَن نُّسَوِّيَ بَنَانَهُۥ","بَلۡ يُرِيدُ ٱلۡإِنسَٰنُ لِيَفۡجُرَ أَمَامَهُۥ","يَسۡـَٔلُ أَيَّانَ يَوۡمُ ٱلۡقِيَٰمَةِ","فَإِذَا بَرِقَ ٱلۡبَصَرُ","وَخَسَفَ ٱلۡقَمَرُ","وَجُمِعَ ٱلشَّمۡسُ وَٱلۡقَمَرُ","يَقُولُ ٱلۡإِنسَٰنُ يَوۡمَئِذٍ أَيۡنَ ٱلۡمَفَرُّ","كَلَّا لَا وَزَرَ","إِلَىٰ رَبِّكَ يَوۡمَئِذٍ ٱلۡمُسۡتَقَرُّ","يُنَبَّؤُاْ ٱلۡإِنسَٰنُ يَوۡمَئِذِۭ بِمَا قَدَّمَ وَأَخَّرَ","بَلِ ٱلۡإِنسَٰنُ عَلَىٰ نَفۡسِهِۦ بَصِيرَةٞ","وَلَوۡ أَلۡقَىٰ مَعَاذِيرَهُۥ","لَا تُحَرِّكۡ بِهِۦ لِسَانَكَ لِتَعۡجَلَ بِهِۦٓ","إِنَّ عَلَيۡنَا جَمۡعَهُۥ وَقُرۡءَانَهُۥ","فَإِذَا قَرَأۡنَٰهُ فَٱتَّبِعۡ قُرۡءَانَهُۥ","ثُمَّ إِنَّ عَلَيۡنَا بَيَانَهُۥ","كَلَّا بَلۡ تُحِبُّونَ ٱلۡعَاجِلَةَ","وَتَذَرُونَ ٱلۡأٓخِرَةَ","وُجُوهٞ يَوۡمَئِذٖ نَّاضِرَةٌ","إِلَىٰ رَبِّهَا نَاظِرَةٞ","وَوُجُوهٞ يَوۡمَئِذِۭ بَاسِرَةٞ","تَظُنُّ أَن يُفۡعَلَ بِهَا فَاقِرَةٞ","كَلَّآ إِذَا بَلَغَتِ ٱلتَّرَاقِيَ","وَقِيلَ مَنۡۜ رَاقٖ","وَظَنَّ أَنَّهُ ٱلۡفِرَاقُ","وَٱلۡتَفَّتِ ٱلسَّاقُ بِٱلسَّاقِ","إِلَىٰ رَبِّكَ يَوۡمَئِذٍ ٱلۡمَسَاقُ","فَلَا صَدَّقَ وَلَا صَلَّىٰ","وَلَٰكِن كَذَّبَ وَتَوَلَّىٰ","ثُمَّ ذَهَبَ إِلَىٰٓ أَهۡلِهِۦ يَتَمَطَّىٰٓ","أَوۡلَىٰ لَكَ فَأَوۡلَىٰ","ثُمَّ أَوۡلَىٰ لَكَ فَأَوۡلَىٰٓ","أَيَحۡسَبُ ٱلۡإِنسَٰنُ أَن يُتۡرَكَ سُدًى","أَلَمۡ يَكُ نُطۡفَةٗ مِّن مَّنِيّٖ يُمۡنَىٰ","ثُمَّ كَانَ عَلَقَةٗ فَخَلَقَ فَسَوَّىٰ","فَجَعَلَ مِنۡهُ ٱلزَّوۡجَيۡنِ ٱلذَّكَرَ وَٱلۡأُنثَىٰٓ","أَلَيۡسَ ذَٰلِكَ بِقَٰدِرٍ عَلَىٰٓ أَن يُحۡـِۧيَ ٱلۡمَوۡتَىٰ","هَلۡ أَتَىٰ عَلَى ٱلۡإِنسَٰنِ حِينٞ مِّنَ ٱلدَّهۡرِ لَمۡ يَكُن شَيۡـٔٗا مَّذۡكُورًا","إِنَّا خَلَقۡنَا ٱلۡإِنسَٰنَ مِن نُّطۡفَةٍ أَمۡشَاجٖ نَّبۡتَلِيهِ فَجَعَلۡنَٰهُ سَمِيعَۢا بَصِيرًا","إِنَّا هَدَيۡنَٰهُ ٱلسَّبِيلَ إِمَّا شَاكِرٗا وَإِمَّا كَفُورًا","إِنَّآ أَعۡتَدۡنَا لِلۡكَٰفِرِينَ سَلَٰسِلَاْ وَأَغۡلَٰلٗا وَسَعِيرًا","إِنَّ ٱلۡأَبۡرَارَ يَشۡرَبُونَ مِن كَأۡسٖ كَانَ مِزَاجُهَا كَافُورًا","عَيۡنٗا يَشۡرَبُ بِهَا عِبَادُ ٱللَّهِ يُفَجِّرُونَهَا تَفۡجِيرٗا","يُوفُونَ بِٱلنَّذۡرِ وَيَخَافُونَ يَوۡمٗا كَانَ شَرُّهُۥ مُسۡتَطِيرٗا","وَيُطۡعِمُونَ ٱلطَّعَامَ عَلَىٰ حُبِّهِۦ مِسۡكِينٗا وَيَتِيمٗا وَأَسِيرًا","إِنَّمَا نُطۡعِمُكُمۡ لِوَجۡهِ ٱللَّهِ لَا نُرِيدُ مِنكُمۡ جَزَآءٗ وَلَا شُكُورًا","إِنَّا نَخَافُ مِن رَّبِّنَا يَوۡمًا عَبُوسٗا قَمۡطَرِيرٗا","فَوَقَىٰهُمُ ٱللَّهُ شَرَّ ذَٰلِكَ ٱلۡيَوۡمِ وَلَقَّىٰهُمۡ نَضۡرَةٗ وَسُرُورٗا","وَجَزَىٰهُم بِمَا صَبَرُواْ جَنَّةٗ وَحَرِيرٗا","مُّتَّكِـِٔينَ فِيهَا عَلَى ٱلۡأَرَآئِكِۖ لَا يَرَوۡنَ فِيهَا شَمۡسٗا وَلَا زَمۡهَرِيرٗا","وَدَانِيَةً عَلَيۡهِمۡ ظِلَٰلُهَا وَذُلِّلَتۡ قُطُوفُهَا تَذۡلِيلٗا","وَيُطَافُ عَلَيۡهِم بِـَٔانِيَةٖ مِّن فِضَّةٖ وَأَكۡوَابٖ كَانَتۡ قَوَارِيرَا۠","قَوَارِيرَاْ مِن فِضَّةٖ قَدَّرُوهَا تَقۡدِيرٗا","وَيُسۡقَوۡنَ فِيهَا كَأۡسٗا كَانَ مِزَاجُهَا زَنجَبِيلًا","عَيۡنٗا فِيهَا تُسَمَّىٰ سَلۡسَبِيلٗا","۞وَيَطُوفُ عَلَيۡهِمۡ وِلۡدَٰنٞ مُّخَلَّدُونَ إِذَا رَأَيۡتَهُمۡ حَسِبۡتَهُمۡ لُؤۡلُؤٗا مَّنثُورٗا","وَإِذَا رَأَيۡتَ ثَمَّ رَأَيۡتَ نَعِيمٗا وَمُلۡكٗا كَبِيرًا","عَٰلِيَهُمۡ ثِيَابُ سُندُسٍ خُضۡرٞ وَإِسۡتَبۡرَقٞۖ وَحُلُّوٓاْ أَسَاوِرَ مِن فِضَّةٖ وَسَقَىٰهُمۡ رَبُّهُمۡ شَرَابٗا طَهُورًا","إِنَّ هَٰذَا كَانَ لَكُمۡ جَزَآءٗ وَكَانَ سَعۡيُكُم مَّشۡكُورًا","إِنَّا نَحۡنُ نَزَّلۡنَا عَلَيۡكَ ٱلۡقُرۡءَانَ تَنزِيلٗا","فَٱصۡبِرۡ لِحُكۡمِ رَبِّكَ وَلَا تُطِعۡ مِنۡهُمۡ ءَاثِمًا أَوۡ كَفُورٗا","وَٱذۡكُرِ ٱسۡمَ رَبِّكَ بُكۡرَةٗ وَأَصِيلٗا","وَمِنَ ٱلَّيۡلِ فَٱسۡجُدۡ لَهُۥ وَسَبِّحۡهُ لَيۡلٗا طَوِيلًا","إِنَّ هَـٰٓؤُلَآءِ يُحِبُّونَ ٱلۡعَاجِلَةَ وَيَذَرُونَ وَرَآءَهُمۡ يَوۡمٗا ثَقِيلٗا","نَّحۡنُ خَلَقۡنَٰهُمۡ وَشَدَدۡنَآ أَسۡرَهُمۡۖ وَإِذَا شِئۡنَا بَدَّلۡنَآ أَمۡثَٰلَهُمۡ تَبۡدِيلًا","إِنَّ هَٰذِهِۦ تَذۡكِرَةٞۖ فَمَن شَآءَ ٱتَّخَذَ إِلَىٰ رَبِّهِۦ سَبِيلٗا","وَمَا تَشَآءُونَ إِلَّآ أَن يَشَآءَ ٱللَّهُۚ إِنَّ ٱللَّهَ كَانَ عَلِيمًا حَكِيمٗا","يُدۡخِلُ مَن يَشَآءُ فِي رَحۡمَتِهِۦۚ وَٱلظَّـٰلِمِينَ أَعَدَّ لَهُمۡ عَذَابًا أَلِيمَۢا","وَٱلۡمُرۡسَلَٰتِ عُرۡفٗا","فَٱلۡعَٰصِفَٰتِ عَصۡفٗا","وَٱلنَّـٰشِرَٰتِ نَشۡرٗا","فَٱلۡفَٰرِقَٰتِ فَرۡقٗا","فَٱلۡمُلۡقِيَٰتِ ذِكۡرًا","عُذۡرًا أَوۡ نُذۡرًا","إِنَّمَا تُوعَدُونَ لَوَٰقِعٞ","فَإِذَا ٱلنُّجُومُ طُمِسَتۡ","وَإِذَا ٱلسَّمَآءُ فُرِجَتۡ","وَإِذَا ٱلۡجِبَالُ نُسِفَتۡ","وَإِذَا ٱلرُّسُلُ أُقِّتَتۡ","لِأَيِّ يَوۡمٍ أُجِّلَتۡ","لِيَوۡمِ ٱلۡفَصۡلِ","وَمَآ أَدۡرَىٰكَ مَا يَوۡمُ ٱلۡفَصۡلِ","وَيۡلٞ يَوۡمَئِذٖ لِّلۡمُكَذِّبِينَ","أَلَمۡ نُهۡلِكِ ٱلۡأَوَّلِينَ","ثُمَّ نُتۡبِعُهُمُ ٱلۡأٓخِرِينَ","كَذَٰلِكَ نَفۡعَلُ بِٱلۡمُجۡرِمِينَ","وَيۡلٞ يَوۡمَئِذٖ لِّلۡمُكَذِّبِينَ","أَلَمۡ نَخۡلُقكُّم مِّن مَّآءٖ مَّهِينٖ","فَجَعَلۡنَٰهُ فِي قَرَارٖ مَّكِينٍ","إِلَىٰ قَدَرٖ مَّعۡلُومٖ","فَقَدَرۡنَا فَنِعۡمَ ٱلۡقَٰدِرُونَ","وَيۡلٞ يَوۡمَئِذٖ لِّلۡمُكَذِّبِينَ","أَلَمۡ نَجۡعَلِ ٱلۡأَرۡضَ كِفَاتًا","أَحۡيَآءٗ وَأَمۡوَٰتٗا","وَجَعَلۡنَا فِيهَا رَوَٰسِيَ شَٰمِخَٰتٖ وَأَسۡقَيۡنَٰكُم مَّآءٗ فُرَاتٗا","وَيۡلٞ يَوۡمَئِذٖ لِّلۡمُكَذِّبِينَ","ٱنطَلِقُوٓاْ إِلَىٰ مَا كُنتُم بِهِۦ تُكَذِّبُونَ","ٱنطَلِقُوٓاْ إِلَىٰ ظِلّٖ ذِي ثَلَٰثِ شُعَبٖ","لَّا ظَلِيلٖ وَلَا يُغۡنِي مِنَ ٱللَّهَبِ","إِنَّهَا تَرۡمِي بِشَرَرٖ كَٱلۡقَصۡرِ","كَأَنَّهُۥ جِمَٰلَتٞ صُفۡرٞ","وَيۡلٞ يَوۡمَئِذٖ لِّلۡمُكَذِّبِينَ","هَٰذَا يَوۡمُ لَا يَنطِقُونَ","وَلَا يُؤۡذَنُ لَهُمۡ فَيَعۡتَذِرُونَ","وَيۡلٞ يَوۡمَئِذٖ لِّلۡمُكَذِّبِينَ","هَٰذَا يَوۡمُ ٱلۡفَصۡلِۖ جَمَعۡنَٰكُمۡ وَٱلۡأَوَّلِينَ","فَإِن كَانَ لَكُمۡ كَيۡدٞ فَكِيدُونِ","وَيۡلٞ يَوۡمَئِذٖ لِّلۡمُكَذِّبِينَ","إِنَّ ٱلۡمُتَّقِينَ فِي ظِلَٰلٖ وَعُيُونٖ","وَفَوَٰكِهَ مِمَّا يَشۡتَهُونَ","كُلُواْ وَٱشۡرَبُواْ هَنِيٓـَٔۢا بِمَا كُنتُمۡ تَعۡمَلُونَ","إِنَّا كَذَٰلِكَ نَجۡزِي ٱلۡمُحۡسِنِينَ","وَيۡلٞ يَوۡمَئِذٖ لِّلۡمُكَذِّبِينَ","كُلُواْ وَتَمَتَّعُواْ قَلِيلًا إِنَّكُم مُّجۡرِمُونَ","وَيۡلٞ يَوۡمَئِذٖ لِّلۡمُكَذِّبِينَ","وَإِذَا قِيلَ لَهُمُ ٱرۡكَعُواْ لَا يَرۡكَعُونَ","وَيۡلٞ يَوۡمَئِذٖ لِّلۡمُكَذِّبِينَ","فَبِأَيِّ حَدِيثِۭ بَعۡدَهُۥ يُؤۡمِنُونَ"],"twins":{"25:1":"تَبَارَكَ ٱلَّذِي نَزَّلَ ٱلۡفُرۡقَانَ عَلَىٰ عَبۡدِهِۦ لِيَكُونَ لِلۡعَٰلَمِينَ نَذِيرًا","11:7":"وَهُوَ ٱلَّذِي خَلَقَ ٱلسَّمَٰوَٰتِ وَٱلۡأَرۡضَ فِي سِتَّةِ أَيَّامٖ وَكَانَ عَرۡشُهُۥ عَلَى ٱلۡمَآءِ لِيَبۡلُوَكُمۡ أَيُّكُمۡ أَحۡسَنُ عَمَلٗاۗ وَلَئِن قُلۡتَ إِنَّكُم مَّبۡعُوثُونَ مِنۢ بَعۡدِ ٱلۡمَوۡتِ لَيَقُولَنَّ ٱلَّذِينَ كَفَرُوٓاْ إِنۡ هَٰذَآ إِلَّا سِحۡرٞ مُّبِينٞ","71:15":"أَلَمۡ تَرَوۡاْ كَيۡفَ خَلَقَ ٱللَّهُ سَبۡعَ سَمَٰوَٰتٖ طِبَاقٗا","41:12":"فَقَضَىٰهُنَّ سَبۡعَ سَمَٰوَاتٖ فِي يَوۡمَيۡنِ وَأَوۡحَىٰ فِي كُلِّ سَمَآءٍ أَمۡرَهَاۚ وَزَيَّنَّا ٱلسَّمَآءَ ٱلدُّنۡيَا بِمَصَٰبِيحَ وَحِفۡظٗاۚ ذَٰلِكَ تَقۡدِيرُ ٱلۡعَزِيزِ ٱلۡعَلِيمِ","25:12":"إِذَا رَأَتۡهُم مِّن مَّكَانِۭ بَعِيدٖ سَمِعُواْ لَهَا تَغَيُّظٗا وَزَفِيرٗا","35:7":"ٱلَّذِينَ كَفَرُواْ لَهُمۡ عَذَابٞ شَدِيدٞۖ وَٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ لَهُم مَّغۡفِرَةٞ وَأَجۡرٞ كَبِيرٌ","6:103":"لَّا تُدۡرِكُهُ ٱلۡأَبۡصَٰرُ وَهُوَ يُدۡرِكُ ٱلۡأَبۡصَٰرَۖ وَهُوَ ٱللَّطِيفُ ٱلۡخَبِيرُ","34:45":"وَكَذَّبَ ٱلَّذِينَ مِن قَبۡلِهِمۡ وَمَا بَلَغُواْ مِعۡشَارَ مَآ ءَاتَيۡنَٰهُمۡ فَكَذَّبُواْ رُسُلِيۖ فَكَيۡفَ كَانَ نَكِيرِ","16:79":"أَلَمۡ يَرَوۡاْ إِلَى ٱلطَّيۡرِ مُسَخَّرَٰتٖ فِي جَوِّ ٱلسَّمَآءِ مَا يُمۡسِكُهُنَّ إِلَّا ٱللَّهُۚ إِنَّ فِي ذَٰلِكَ لَأٓيَٰتٖ لِّقَوۡمٖ يُؤۡمِنُونَ","23:78":"وَهُوَ ٱلَّذِيٓ أَنشَأَ لَكُمُ ٱلسَّمۡعَ وَٱلۡأَبۡصَٰرَ وَٱلۡأَفۡـِٔدَةَۚ قَلِيلٗا مَّا تَشۡكُرُونَ","23:79":"وَهُوَ ٱلَّذِي ذَرَأَكُمۡ فِي ٱلۡأَرۡضِ وَإِلَيۡهِ تُحۡشَرُونَ","36:48":"وَيَقُولُونَ مَتَىٰ هَٰذَا ٱلۡوَعۡدُ إِن كُنتُمۡ صَٰدِقِينَ","46:23":"قَالَ إِنَّمَا ٱلۡعِلۡمُ عِندَ ٱللَّهِ وَأُبَلِّغُكُم مَّآ أُرۡسِلۡتُ بِهِۦ وَلَٰكِنِّيٓ أَرَىٰكُمۡ قَوۡمٗا تَجۡهَلُونَ","18:41":"أَوۡ يُصۡبِحَ مَآؤُهَا غَوۡرٗا فَلَن تَسۡتَطِيعَ لَهُۥ طَلَبٗا"}}]}</script>
<script>
(()=>{
const ALLD=JSON.parse(document.getElementById("data").textContent);
let D,C,V,SEC,POOL,ALL,_ch,S;
const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const MARKS=/[ؐ-ًؚ-ٰٟۖ-ۭـࣰ-ࣿ]/g;
const sk=w=>w.replace(MARKS,"").replace(/[اأإآٱءى]/g,m=>m==="ى"?"ي":"").replace(/ة/g,"ه").replace(/ؤ/g,"و").replace(/ئ/g,"ي");
const words=t=>t.split(/\s+/).filter(Boolean);
const textOf=k=>{const[s,a]=k.split(":").map(Number);return s===D.meta.surah?V[a-1]:(D.twins[k]||"")};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);
const secOf=a=>SEC.findIndex(s=>a>=s.from&&a<=s.to);
const secStyle=a=>'style="--sec:'+SEC[secOf(a)].color+'"';


/* storage: this device only */
function load(){let st={done:{},cur:0,rounds:{}};try{const r=localStorage.getItem(D.meta.store);if(r)st=Object.assign(st,JSON.parse(r))}catch(e){}
  const fix=o=>{const n={};Object.keys(o||{}).forEach(k=>{n[k.includes(":")?k.split(":")[1]:k]=o[k]});return n};st.done=fix(st.done);st.rounds=fix(st.rounds);
  if(!(st.cur>=0&&st.cur<C.length))st.cur=0;return st}
const pref=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
function useDeck(id){D=ALLD.decks.find(x=>x.id===id)||ALLD.decks[0];C=D.cards;V=D.verses;SEC=D.sections;POOL=D.pool||[];ALL=V.concat(POOL);_ch=null;S=load();pref("hifz-deck",D.id);$("#brand").textContent=D.meta.title}
const doneWord=()=>D.meta.mode==="review"?"ثبتت":"حُفظت";
const save=()=>{try{localStorage.setItem(D.meta.store,JSON.stringify(S))}catch(e){}};

/* matching */
const TESTS=[(a,p)=>a===p,(a,p)=>a.startsWith(p),(a,p)=>p.length>2&&a.endsWith(p)];
function findSpan(s,kw,used){const parts=words(kw).map(sk).filter(Boolean);
  for(const f of TESTS)for(let i=0;i+parts.length<=s.length;i++){if(parts.some((_,j)=>used.has(i+j)))continue;if(parts.every((p,j)=>f(s[i+j],p)))return[i,parts.length]}return null}
function spans(ws,list){const s=ws.map(sk),used=new Set(),out=[];list.forEach((kw,n)=>{const sp=findSpan(s,kw,used);if(sp){for(let j=0;j<sp[1];j++)used.add(sp[0]+j);out.push([sp[0],sp[1],n])}});return out}
function chunks(ws){const out=[];let cur=[];
  ws.forEach((w,i)=>{cur.push(i);const stop=/[ۖۗۘۙۚۛ]$/.test(w);if((stop&&cur.length>=3)||cur.length>=7){out.push(cur);cur=[]}});
  if(cur.length){if(cur.length<3&&out.length)out[out.length-1]=out[out.length-1].concat(cur);else out.push(cur)}
  if(out.length<2&&ws.length>=4){const h=Math.ceil(ws.length/2);return[[...Array(h).keys()],[...Array(ws.length-h).keys()].map(x=>x+h)]}
  return out}

/* quiz building */
const pick=(arr,n,avoid)=>{const seen=new Set((avoid||[]).map(sk)),out=[];for(const x of arr){const key=sk(x);if(!key||seen.has(key))continue;seen.add(key);out.push(x);if(out.length>=n)break}return out};

function buildQuiz(c){const ws=words(V[c.a-1]),ch=chunks(ws),cht=ch.map(x=>x.map(j=>ws[j]).join(" ")),Q=[];

  const op=opening(V[c.a-1]),opDis=shuffle(V.filter((_,j)=>j!==c.a-1).map(t=>opening(t)));
  if(tw.length)opDis.unshift(opening(tw.join(" ")));
  Q.push({t:"mc",title:"🎬 من المشهد: بأيّ كلمات تبدأ الآية؟",pre:scenePanel(c,{noPath:1}),ans:op,opts:shuffle([op].concat(pick(opDis,3,[op])))});
  // meaning
  if(c.m.length){const [w,mean]=c.m[Math.floor(Math.random()*c.m.length)],others=shuffle(C.flatMap(x=>x.m.map(y=>y[1])).filter(x=>x!==mean));
    const sp=spans(ws,[w])[0],shown=sp?ws.slice(sp[0],sp[0]+sp[1]).join(" "):w;
    const uniq=[];others.forEach(o=>{if(!uniq.includes(o)&&uniq.length<3)uniq.push(o)});
    Q.push({t:"mc",ui:1,title:"📖 ما معنى الكلمة؟",pre:'<div class="big-word">'+shown+'</div>',ans:mean,opts:shuffle([mean].concat(uniq))})}
  // cloze (2 keywords)
  const kwPool=shuffle(C.filter(x=>x.a!==c.a).flatMap(x=>x.k));
  shuffle(spans(ws,c.k)).slice(0,2).forEach(([s,len])=>{const ans=ws.slice(s,s+len).join(" ");
    const ci=ch.findIndex(x=>x.includes(s)),from=ch[Math.max(0,ci-1)][0],to=ch[ci].slice(-1)[0];
    const ctx=[];for(let j=from;j<=Math.max(to,s+len-1);j++){if(j===s){ctx.push('<span class="blank">؟</span>');j+=len-1}else ctx.push(ws[j])}
    const twW=len===1?shuffle(tw.filter(w=>!ws.some(x=>sk(x)===sk(w))&&Math.abs(sk(w).length-sk(ans).length)<=3)):[];
    const dis=twW.concat(kwPool.filter(k=>words(k).length===len).map(voc));
    Q.push({t:"mc",title:"✍️ أكمل الفراغ",pre:'<div class="card"><div class="quran sm">'+(from>0?"… ":"")+ctx.join(" ")+(Math.max(to,s+len-1)<ws.length-1?" …":' <span class="am">﴿'+AR(c.a)+'﴾</span>')+'</div></div>',ans,opts:shuffle([ans].concat(pick(dis,3,[ans])))})});
  // next chunk
  if(cht.length>=2){const j=Math.floor(Math.random()*(cht.length-1)),ans=cht[j+1];
    const dis=shuffle(cht.filter((_,x)=>x!==j&&x!==j+1)).concat(shuffle(twCh),shuffle(allChunks()).slice(0,40));
    Q.push({t:"mc",title:"➡️ ماذا يأتي بعد هذا المقطع؟",pre:'<div class="card"><div class="quran sm">'+(j>0?"… ":"")+cht[j]+' …</div></div>',ans,opts:shuffle([ans].concat(pick(dis,3,[ans,cht[j]])))})}
  // order
  const un=units(ws);if(un.length>=3){const st=un.length>5?Math.floor(Math.random()*(un.length-4)):0,seq=un.slice(st,st+5).map(x=>x.map(j=>ws[j]).join(" "));

    Q.push({t:"mc",title:"🔗 الربط: ما الآية التي تأتي بعدها؟",pre:'<div class="card"><div class="quran sm">… '+ws.slice(-4).join(" ")+' <span class="am">﴿'+AR(c.a)+'﴾</span> <span class="blank">؟</span></div></div>',ans:nx,opts:shuffle([nx].concat(pick(dis,3,[nx])))})}

  if(D.numbers&&D.numbers.length)h+='<div class="card"><p class="lbl">🔢 الأرقام: كلمات تتكرّر في السورة</p><div class="nums">'+D.numbers.map(([w,n,where])=>'<div class="num"><span class="x">×'+n+'</span><b>'+w+'</b><small>الآيات '+where+'</small></div>').join("")+'</div></div>';
  h+='<div class="card"><p class="lbl">🔗 اختبار السلسلة</p><p class="small" style="margin-top:0">عشرة أسئلة: نهاية آية، وتختار الآية التي بعدها. يثبّت الانتقال من آياتك إلى ما بعدها.</p><button class="btn primary" data-act="chain"'+(done<3?' disabled':'')+'>ابدأ السلسلة</button>'+(done<3?'<span class="small muted"> يُفتح بعد حفظ ٣ آيات.</span>':'')+'</div>';
  h+='<div class="card small muted">التقدّم محفوظ على هذا الجهاز فقط.<div class="row" style="margin-top:10px"><button class="btn" data-act="reset">ابدأ من جديد</button></div></div>';
  $("#main").innerHTML=h}

function renderHome(){const last=pref("hifz-deck");
  let h='<h2 style="margin:22px 0 4px">اختر السورة</h2><p class="muted" style="margin:0 0 8px">لكل سورة بطاقاتها وتقدّمها.</p>';
  ALLD.decks.forEach(d=>{let st={done:{}};try{const r=localStorage.getItem(d.meta.store);if(r)st=JSON.parse(r)}catch(e){}
    const n=d.cards.length,dn=Math.min(n,Object.keys(st.done||{}).length),pc=Math.round(dn/n*100),col=d.sections[0].color;
    h+='<button class="deck'+(d.id===last?' last':'')+'" style="--sec:'+col+'" data-act="deck" data-id="'+d.id+'"><span class="dk-ico">'+d.frame.s+'</span><span class="dk-body"><b>سورة '+d.meta.name+'</b><span class="dk-mode">'+(d.meta.mode==="review"?"🔁 مراجعة":"🌱 حفظ")+' · '+esc(d.meta.sub)+'</span><span class="dk-bar"><i style="width:'+pc+'%"></i></span><span class="small muted">'+AR(dn)+' من '+AR(n)+' آية'+(d.id===last?' · آخر ما فتحت':'')+'</span></span><span class="dk-go">◂</span></button>'});
  h+='<p class="small muted" style="margin-top:18px">التقدّم محفوظ على هذا الجهاز فقط.</p>';
  $("#main").innerHTML=h}
function render(){header();if(UI.view==="home"||!D)return renderHome();if(UI.view==="map")renderMap();else if(UI.view==="quiz")renderQuiz();else renderCard()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b||b.disabled)return;const a=b.dataset.act,z=UI.quiz;
  if(a==="home"){UI.view="home"}
  else if(a==="deck"){useDeck(b.dataset.id);UI.view="card";UI.bub=null}
  else if(a==="map")UI.view="map";
  else if(a==="card"){UI.view="card"}
  else if(a==="bub"){const n=+b.dataset.n;UI.bub=UI.bub===n?null:n}
  else if(a==="prev"){S.cur=Math.max(0,S.cur-1);save();UI.view="card";UI.bub=null}
  else if(a==="next"){S.cur=Math.min(C.length-1,S.cur+1);save();UI.view="card";UI.bub=null}
  else if(a==="goto"){S.cur=+b.dataset.i;save();UI.view="card";UI.bub=null}
  else if(a==="start"){UI.quiz=buildQuiz(C[S.cur]);UI.view="quiz"}
  else if(a==="chain"){UI.quiz=buildChain();UI.view="quiz"}
  else if(a==="mc"){const q=z.Q[z.i],j=+b.dataset.j;z.res[z.i]=q.opts[j]===q.ans;z.state={pick:j,final:true}}
  else if(a==="ord"){const q=z.Q[z.i],st=z.state,o=q.opts[+b.dataset.j];
    if(o.i===st.got.length){st.got.push(o.i);if(st.got.length===q.seq.length){z.res[z.i]=!st.miss;st.final=true}}
    else{st.miss=true;b.classList.add("bad","shake");setTimeout(()=>b.classList.remove("bad","shake"),400);return}}
  else if(a==="reveal"){z.state={}}
  else if(a==="self"){z.res[z.i]=b.dataset.v==="1";z.state.self=1;z.state.final=true}
  else if(a==="qnext"){z.i++;z.state=null}
  else if(a==="reset"){if(!b.dataset.sure){b.dataset.sure=1;b.textContent="اضغط مرة أخرى للتأكيد";return}S={done:{},cur:0,rounds:{}};save();UI.view="card"}
  render();if(!["bub","mc","ord","reveal","self"].includes(a))window.scrollTo(0,0)});
UI.view="home";render();
})();
</script>
<script>if("serviceWorker" in navigator&&location.protocol.startsWith("http")){navigator.serviceWorker.register("sw.js").catch(()=>{})}</script>
